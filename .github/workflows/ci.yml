name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Build & Test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JS unit tests
        run: node --test 'Tests/Web/**/*.test.js'

      - name: Check links, budgets and changelog
        run: python3 scripts/check-docs.py --strict

      - name: Check coverage exclusions
        run: python3 scripts/check-coverage.py

      - name: Changelog release scripts
        run: scripts/test-changelog-release.sh

      - name: Setup Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.4"

      - name: Swift version
        run: swift --version

      - name: Build
        run: ./build.sh

      - name: Generated docs are current
        run: |
          python3 scripts/gen-docs.py .build/release/Baguette
          git diff --exit-code -- docs/commands.md docs/README.md skills/baguette/references \
            || { echo "::error::Generated docs are stale; run 'make docs' and commit"; exit 1; }

      - name: Test with coverage
        run: swift test --enable-code-coverage

      # A package that depends on the BaguetteKit product, resolved fresh
      # (no Package.resolved), the way SimKit and every other host is: it
      # breaks when the library stops building for anyone but this repo.
      - name: Library consumer builds
        run: swift build --package-path examples/ListSimulators

      - name: Generate lcov report
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          # The bundles' names depend on the build system: the native one
          # makes one BaguettePackageTests.xctest; swiftbuild (Swift 6.4's
          # default) makes one per test target (BaguetteTests,
          # WebRTCKitTests). Every one goes in, or the report covers only
          # the sources the first one links.
          OBJECTS=()
          for BUNDLE in "$BIN_PATH"/*Tests.xctest; do
            [ -d "$BUNDLE" ] || continue
            BIN="$BUNDLE/Contents/MacOS/$(basename "$BUNDLE" .xctest)"
            if [ ${#OBJECTS[@]} -eq 0 ]; then OBJECTS+=("$BIN"); else OBJECTS+=(-object "$BIN"); fi
          done
          [ ${#OBJECTS[@]} -gt 0 ] || { echo "::error::No test bundle in $BIN_PATH"; exit 1; }
          PROFDATA="$(dirname "$(swift test --show-codecov-path)")/default.profdata"
          # What is left out lives in codecov.yml's `ignore:`, one list;
          # the regex is generated from it.
          IGNORE=$(python3 scripts/check-coverage.py --regex)
          xcrun llvm-cov export "${OBJECTS[@]}" \
            -instr-profile "$PROFDATA" \
            -format=lcov \
            -ignore-filename-regex="$IGNORE" \
            > coverage.lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: tddworks/baguette
          files: coverage.lcov
          fail_ci_if_error: true
