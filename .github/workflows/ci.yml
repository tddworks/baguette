name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Build & Test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JS unit tests
        run: node --test 'Tests/Web/**/*.test.js'

      - name: Check links, budgets and changelog
        run: python3 scripts/check-docs.py --strict

      - name: Changelog release scripts
        run: scripts/test-changelog-release.sh

      - name: Setup Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.2"

      - name: Swift version
        run: swift --version

      - name: Build
        run: ./build.sh

      - name: Generated docs are current
        run: |
          python3 scripts/gen-docs.py .build/release/Baguette
          git diff --exit-code -- docs/commands.md docs/README.md skills/baguette/references \
            || { echo "::error::Generated docs are stale; run 'make docs' and commit"; exit 1; }

      - name: Test with coverage
        run: swift test --enable-code-coverage

      - name: Generate lcov report
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          XCTEST="$BIN_PATH/BaguettePackageTests.xctest/Contents/MacOS/BaguettePackageTests"
          PROFDATA="$BIN_PATH/codecov/default.profdata"
          # Excluded: IO / 3rd-party-SDK shims (CoreSimulator, SimulatorKit,
          # IOKit HID, Hummingbird, VideoToolbox, CoreImage, IOSurface,
          # stdin/stdout) and the thin command-layer files that do nothing
          # but wire those shims together — they need a booted simulator or
          # live socket to exercise meaningfully.
          xcrun llvm-cov export "$XCTEST" \
            -instr-profile "$PROFDATA" \
            -format=lcov \
            -ignore-filename-regex=".build|Tests|Resources|Mock|Infrastructure/Server/|Infrastructure/Simulator/|Infrastructure/Input/|Infrastructure/Screen/|Infrastructure/Stream/|Infrastructure/Chrome/PDFRasterizer|App/Commands/|App/Logger" \
            > coverage.lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: tddworks/baguette
          files: coverage.lcov
          fail_ci_if_error: true
