coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%
        threshold: 1%

# The one list of what unit coverage leaves out. CI's llvm-cov regex is
# generated from it (`scripts/check-coverage.py --regex`), so nothing else
# needs editing when a file moves.
#
# What is left out is a kind of code, not a list of files: an irreducible
# call to the outside world (a private framework, VideoToolbox, a socket, a
# process) lives in an `Internal/System/` folder, thin by rule — the check
# fails a file there over 100 lines. Everything that decides something
# stays outside `System/` and is measured.
ignore:
  - "Sources/Baguette/Resources/**"
  - "**/Internal/System/**"
  # The one CoreDevice call Swift can't spell, in C: a system call by
  # nature, in a target of its own.
  - "Sources/CoreDeviceABI/**"
  - "Tests/**"
