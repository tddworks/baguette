coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%
        threshold: 1%

# Mirror the lcov exclusions in .github/workflows/ci.yml: IO / 3rd-party
# shims around CoreSimulator, SimulatorKit, IOKit HID, Hummingbird,
# VideoToolbox, CoreImage, IOSurface, CoreDevice and stdin/stdout sinks need a
# booted simulator, a phone on a cable or a live socket to exercise — and the thin command-layer files
# that do nothing but wire those shims together follow the same rule.
ignore:
  - "Sources/Baguette/Resources/**"
  - "Sources/Server/**"
  - "Sources/Devices/Simulator/Internal/*.swift"
  - "Sources/Devices/Simulator/Internal/Input/**"
  - "Sources/Devices/Simulator/Internal/Screen/**"
  - "Sources/Device/Abilities/Screen/Internal/**"
  # The host's stream encoders and pumps (Capture's Internal, minus Recording).
  - "Sources/Device/Abilities/Capture/Internal/AVCCStream.swift"
  - "Sources/Device/Abilities/Capture/Internal/ControlChannel.swift"
  - "Sources/Device/Abilities/Capture/Internal/H264*.swift"
  - "Sources/Device/Abilities/Capture/Internal/JPEGEncoder.swift"
  - "Sources/Device/Abilities/Capture/Internal/MJPEGStream.swift"
  - "Sources/Device/Abilities/Capture/Internal/SeedFilter.swift"
  - "Sources/Device/Abilities/Capture/Internal/StdoutSink.swift"
  - "Sources/Device/Abilities/Capture/Internal/Stream*.swift"
  - "Sources/Device/Abilities/Capture/Internal/VT*.swift"
  - "Sources/Device/Abilities/Capture/Internal/VideoFrameScaler.swift"
  - "Sources/Device/Chrome/Internal/PDFRasterizer.swift"
  # A phone's private CoreDevice calls and live tunnel sockets: their
  # formats and rules are pure values in Devices/iPhone, tested there.
  - "Sources/Devices/iPhone/Internal/Kit/CoreDeviceFramework.swift"
  - "Sources/Devices/iPhone/Internal/Kit/DigitizerReport.swift"
  - "Sources/Devices/iPhone/Internal/Input/CoreDeviceDigitizer.swift"
  - "Sources/Devices/iPhone/Internal/Screen/MediaStreamScreen.swift"
  - "Sources/Devices/iPhone/Internal/Accessibility/**"
  - "Sources/Commands/**"
  - "Sources/Device/Internal/Logger.swift"
  - "Tests/**"
