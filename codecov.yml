coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%
        threshold: 1%

# The one list of what unit coverage leaves out. CI's llvm-cov regex is
# generated from it (`scripts/check-coverage.py --regex`), so nothing else
# needs editing when a file moves.
#
# What is left out is a kind of code, not a list of files: an irreducible
# call to the outside world (a private framework, VideoToolbox, a socket, a
# process) lives in an `Internal/System/` folder, thin by rule — the check
# fails a file there over 100 lines. Everything that decides something
# stays outside `System/` and is measured.
ignore:
  - "Sources/Baguette/Resources/**"
  - "**/Internal/System/**"
  # Not yet measured: the routes and commands, until the router is tested
  # in-process (HummingbirdTesting) and each `run()` is thin.
  - "Sources/Server/**"
  - "Sources/Commands/**"
  # Still to split: each mixes decisions with its system call. Split one,
  # move its call into `System/`, delete its line.
  - "Sources/Device/Abilities/Capture/Internal/AVCCStream.swift"
  - "Sources/Device/Abilities/Capture/Internal/H264Encoder.swift"
  - "Sources/Device/Abilities/Capture/Internal/MJPEGStream.swift"
  - "Sources/Device/Abilities/Capture/Internal/VTH264Decoder.swift"
  - "Sources/Device/Abilities/Capture/Internal/VTStreamDecoder.swift"
  - "Sources/Devices/Simulator/Internal/CoreSimulator.swift"
  - "Sources/Devices/Simulator/Internal/CoreSimulators.swift"
  - "Sources/Devices/Simulator/Internal/InjectedDylibInstaller.swift"
  - "Sources/Devices/Simulator/Internal/Input/IndigoHIDInput.swift"
  - "Sources/Devices/Simulator/Internal/Screen/SimulatorKitScreen.swift"
  - "Sources/Devices/Simulator/Internal/SimulatorKitDisplay.swift"
  - "Sources/Devices/Simulator/Internal/SimulatorKitFramebuffers.swift"
  - "Sources/Devices/Simulator/Internal/SimulatorKitScreenOrientation.swift"
  - "Sources/Devices/iPhone/Internal/Accessibility/RemoteAXAccessibility.swift"
  - "Sources/Devices/iPhone/Internal/Input/CoreDeviceDigitizer.swift"
  - "Sources/Devices/iPhone/Internal/Kit/CoreDeviceFramework.swift"
  - "Sources/Devices/iPhone/Internal/Kit/DigitizerReport.swift"
  - "Sources/Devices/iPhone/Internal/Screen/MediaStreamScreen.swift"
  - "Sources/Device/Abilities/Camera/Internal/HostVideoCapture.swift"
  - "Tests/**"
