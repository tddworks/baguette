<!doctype html>
<html><head><meta charset="utf-8"><title>Live view bench</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font:13px ui-monospace,monospace;background:#111;color:#ddd;margin:16px}a{color:#8cf}
#view{display:flex;flex-wrap:wrap;gap:16px}canvas,video{height:600px;max-height:60vh;max-width:100%;background:#222;border:1px solid #444}
pre{white-space:pre-wrap}</style></head>
<body>
<a id="back" href="./">← back</a>
<div id="view"><canvas id="cv"></canvas><video id="vid" autoplay playsinline muted></video><pre id="log"></pre></div>
<script>
// ?transport=ws|webrtc&udid=&taps=100[&mode=bw&secs=30] — serve and WHEP are reached through this page's origin (proxy.mjs)
const q = new URLSearchParams(location.search);
const T = q.get('transport') || 'ws', UDID = q.get('udid'), TAPS = +(q.get('taps') || 100);
// WebRTC runs use baguette's own WHEP route; `whep=/whep` measures the MediaMTX spike instead, and
// `whep=/pion/whep` the same encoder sent through Pion (pion/main.go), the reference WebRTC sender.
const SERVE = q.get('serve') || location.origin + '/api';
// `pacing=off`: baguette's own sender without its pacer — the baseline the pacer is measured against.
const UNPACED = q.get('pacing') === 'off';
// `rtx=off`: baguette's own sender resending as sent, not on its own stream — the baseline RTX is measured against.
const NO_RTX = q.get('rtx') === 'off';
// `codec=h265`: baguette's own sender in H.265 (slice 6 of docs/features/webrtc/hevc.md), the browser preferring it.
const CODEC = q.get('codec');
const WHEP_QUERY = [UNPACED && 'pacing=off', NO_RTX && 'rtx=off', CODEC && 'codec=' + encodeURIComponent(CODEC)].filter(Boolean).join('&');
const WHEP = q.get('whep') || '/api/devices/' + encodeURIComponent(UDID) + '/whep' + (WHEP_QUERY ? '?' + WHEP_QUERY : '');
const SPIKE = /^(https?:\/\/[^/]+)?\/whep$/.test(WHEP);
const PION = WHEP.startsWith('/pion/');
// `tap=post`: every sender's taps posted to baguette serve's POST /input, so the senders compare on one input path.
const TAP_PATH = (T === 'webrtc' && (PION || SPIKE)) || q.get('tap') === 'post' ? 'POST /input' : 'socket';
const BANDWIDTH_ONLY = q.get('mode') === 'bw';
const W = +(q.get('w') || 402), H = +(q.get('h') || 874);
document.getElementById('back').href = './?udid=' + encodeURIComponent(UDID);
const logEl = document.getElementById('log'); const log = (...a) => { logEl.textContent += a.join(' ') + '\n'; console.log('[bench]', ...a); };
const probe = new OffscreenCanvas(1, 1).getContext('2d', { willReadFrequently: true });
const R = window.__bench = { transport: T, sender: T === 'ws' ? 'websocket' : PION ? 'pion' : SPIKE ? 'mediamtx' : 'baguette' + (UNPACED ? ', no pacer' : '') + (NO_RTX ? ', no rtx' : ''), tapPath: TAP_PATH, t0: performance.now(), firstFrame: null, frames: [], samples: [], done: false };

// Every presented frame lands here with the time it reaches the screen and its centre-pixel luma.
// Both paths stamp the moment the frame is expected on screen, never the start of the frame
// interval it arrived in: that can precede the tap, which once gave a "-1.4 ms" tap-to-photon.
// The centre pixel of the last presented frame. The probe page is black at rest, red while a
// touch on its left half is down, green for its right half.
let last = { r: 0, g: 0, b: 0 };
const black = c => c.r < 64 && c.g < 64 && c.b < 64;
const red = c => c.r > 128 && c.g < 96, green = c => c.g > 128 && c.r < 96;
function presented(ts, src, sw, sh, meta) {
  if (R.firstFrame === null) { R.firstFrame = ts - R.t0; log('first frame', R.firstFrame.toFixed(0), 'ms'); }
  R.frames.push(ts);
  probe.drawImage(src, sw / 2, sh / 2, 1, 1, 0, 0, 1, 1);
  const d = probe.getImageData(0, 0, 1, 1).data; last = { r: d[0], g: d[1], b: d[2] };
  if (waiter && waiter.want(last)) { const w = waiter; waiter = null; R.hitMeta = meta; w.resolve(ts); }
}
let waiter = null;
const until = (want, ms) => new Promise((resolve, reject) => {
  waiter = { want, resolve };
  setTimeout(() => { if (waiter && waiter.resolve === resolve) { waiter = null; resolve(null); } }, ms);
});

// --- transport: today's stream WebSocket, decoded like frame-decoder.js, painted on rAF like stream-session.js.
// Like the serve page (stream-format.js, issue #71): H.264 needs WebCodecs, which browsers only give secure
// contexts (HTTPS or localhost), so a plain-http page on a phone gets MJPEG, as it does from baguette serve.
function startWS() {
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  document.getElementById('vid').style.display = 'none';
  let pending = null, cfg = null, ts = 0;
  const avcc = typeof VideoDecoder !== 'undefined';
  R.format = avcc ? 'avcc' : 'mjpeg';
  log('WebSocket format:', avcc ? 'H.264 (WebCodecs)' : 'MJPEG (no WebCodecs on a plain-http page)');
  const keep = f => { if (pending) pending.close(); pending = f; };
  const dec = avcc ? new VideoDecoder({ output: keep, error: e => log('decoder', e.message) }) : null;
  const ws = new WebSocket(SERVE.replace('http', 'ws') + '/devices/' + UDID + '/stream?format=' + R.format);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { for (const m of [{ type: 'set_scale', scale: 1 }, { type: 'set_fps', fps: 60 }, { type: 'set_bitrate', bps: 8000000 }, { type: 'force_idr' }]) ws.send(JSON.stringify(m)); };
  ws.onmessage = e => {
    if (!(e.data instanceof ArrayBuffer)) return;
    R.wsBytes = (R.wsBytes || 0) + e.data.byteLength; R.wsMsgs = (R.wsMsgs || 0) + 1;
    if (!avcc) { createImageBitmap(new Blob([e.data], { type: 'image/jpeg' })).then(keep, () => {}); return; }
    const b = new Uint8Array(e.data), tag = b[0], p = b.slice(1);
    if (tag === 1) { cfg = { codec: 'avc1.' + [1, 2, 3].map(i => p[i].toString(16).padStart(2, '0')).join(''), description: p.buffer, optimizeForLatency: true, hardwareAcceleration: 'prefer-hardware' }; dec.configure(cfg); }
    else if ((tag === 2 || tag === 3) && dec.state === 'configured') { dec.decode(new EncodedVideoChunk({ type: tag === 2 ? 'key' : 'delta', timestamp: ts, data: p.buffer })); ts += 16667; }
  };
  ws.onclose = e => log('ws closed', e.code, e.reason);
  R.taps = ws;   // the page sends its gestures down its stream socket
  let vsync = 1000 / 60, lastRaf = null;
  const paint = t => {
    if (lastRaf !== null && t - lastRaf < 50) vsync = 0.9 * vsync + 0.1 * (t - lastRaf);
    lastRaf = t;
    if (pending) {
      const f = pending; pending = null;
      const w = f.displayWidth || f.width, h = f.displayHeight || f.height;
      if (cv.width !== w) { cv.width = w; cv.height = h; }
      ctx.drawImage(f, 0, 0);
      // Drawn in this rAF, the canvas reaches the screen at the next vsync.
      presented(t + vsync, f, w, h); f.close();
    }
    requestAnimationFrame(paint);
  };
  requestAnimationFrame(paint);
  R.stop = () => ws.close();
}

// --- transport: WHEP, set up as the design doc's "The viewer" section describes
async function startWebRTC() {
  document.getElementById('cv').style.display = 'none';
  const vid = document.getElementById('vid');
  // As the device page does: the server's STUN servers, then an offer that carries the gathered candidates.
  let iceServers = [];
  if (!SPIKE && !PION) try { iceServers = (await (await fetch(SERVE + '/webrtc/ice-servers')).json()).iceServers || []; } catch (_) {}
  // `relay=1`: the browser may only use relayed candidates — proves the TURN path.
  const pc = new RTCPeerConnection({ bundlePolicy: 'max-bundle', iceServers, iceTransportPolicy: q.get('relay') === '1' ? 'relay' : 'all' });
  let viewer;
  R.pc = pc;
  // Hang up on setup failure as well, without waiting for consent to expire.
  R.stop = () => { pc.close(); R.taps?.close(); if (viewer && !SPIKE) fetch((PION ? '' : '/api') + viewer, { method: 'DELETE' }); };
  const tr = pc.addTransceiver('video', { direction: 'recvonly' });
  const caps = RTCRtpReceiver.getCapabilities('video').codecs;
  const named = m => caps.filter(c => c.mimeType.toLowerCase() === m);
  const first = [...(CODEC === 'h265' || CODEC === 'auto' ? named('video/h265') : []), ...named('video/h264')];
  tr.setCodecPreferences([...first, ...caps.filter(c => !first.includes(c))]);
  pc.ontrack = e => { e.receiver.jitterBufferTarget = 0; if ('playoutDelayHint' in e.receiver) e.receiver.playoutDelayHint = 0; vid.srcObject = e.streams[0]; };
  pc.onconnectionstatechange = () => log('pc', pc.connectionState);
  const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
  await new Promise(resolve => {
    if (pc.iceGatheringState === 'complete') return resolve();
    pc.onicegatheringstatechange = () => { if (pc.iceGatheringState === 'complete') resolve(); };
    setTimeout(resolve, 2000);
  });
  const res = await fetch(WHEP, { method: 'POST', headers: { 'Content-Type': 'application/sdp' }, body: pc.localDescription.sdp });
  if (!res.ok) { throw new Error('WHEP ' + res.status + ' ' + (await res.text()).slice(0, 200)); }
  viewer = res.headers.get('Location');
  if (viewer) R.viewerID = new URL(viewer, location.origin).pathname.split('/').filter(Boolean).at(-1);
  let sdp = (await res.text()).replace(/a=rtcp-fb:\d+ goog-remb\r?\n/g, '');
  if (!sdp.includes('b=AS:')) sdp = sdp.replace(/(c=IN\s+\S+\s+\S+\r?\n)/, '$1b=AS:15000\r\n');
  await pc.setRemoteDescription({ type: 'answer', sdp });
  // baguette's viewer takes gestures on its control socket, as the device page sends them;
  // Pion and MediaMTX have none, so their taps are posted.
  if (TAP_PATH === 'socket' && !BANDWIDTH_ONLY) {
    if (!viewer) throw new Error('missing viewer Location for input WebSocket');
    R.taps = new WebSocket(SERVE.replace('http', 'ws') + viewer + '/control');
    await new Promise(resolve => {
      const timeout = setTimeout(resolve, 3000);
      const settled = () => { clearTimeout(timeout); resolve(); };
      R.taps.onopen = R.taps.onerror = R.taps.onclose = settled;
    });
    inputSocket();
  }
  // `scale=2`: baguette's viewer streams at that divisor (its control socket's set_scale), so it can be
  // compared at the resolution of a reference sender that streams at half size.
  const SCALE = +q.get('scale');
  if (SCALE > 1 && !PION && !SPIKE && viewer) {
    const control = R.taps?.readyState === WebSocket.OPEN ? R.taps : new WebSocket(SERVE.replace('http', 'ws') + viewer + '/control');
    const send = () => control.send(JSON.stringify({ type: 'set_scale', scale: SCALE }));
    if (control.readyState === WebSocket.OPEN) send(); else control.onopen = send;
    if (control !== R.taps) R.scaleControl = control;
  }
  const onFrame = (now, meta) => { presented(meta.expectedDisplayTime ?? now, vid, meta.width, meta.height, meta); vid.requestVideoFrameCallback(onFrame); };
  vid.requestVideoFrameCallback(onFrame);
}

function inputSocket() {
  if (R.taps?.readyState !== WebSocket.OPEN) throw new Error('input WebSocket is not open');
  return R.taps;
}

// --- the probe: tap the fixture's centre, time until the centre turns white
function tap(side) {
  const envelope = { type: 'tap', x: side === 'left' ? W / 4 : 3 * W / 4, y: H / 2, width: W, height: H, duration: 0.15 };
  if (TAP_PATH === 'socket') { inputSocket().send(JSON.stringify(envelope)); return; }
  // text/plain + no-cors: a simple request, so no preflight; we don't read the ack.
  fetch(SERVE + '/devices/' + UDID + '/input', { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(envelope) }).catch(error => log('POST /input:', error.message));
}
const pct = (a, p) => { const s = [...a].sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.floor(p / 100 * s.length))]; };
async function rtcBytes() { let b = 0, p = 0; (await R.pc.getStats()).forEach(r => { if (r.type === 'inbound-rtp' && r.kind === 'video') { b += r.bytesReceived + (r.headerBytesReceived || 0); p += r.packetsReceived; } }); return { b, p }; }
async function counter() { return T === 'ws' ? { b: R.wsBytes || 0, p: R.wsMsgs || 0 } : rtcBytes(); }

// The proxy and the native sender run on the same Mac. The shortest round
// trip bounds the uncertainty when mapping browser frame times to that clock.
async function calibrateClock() {
  async function sample() {
    const sentAt = performance.now();
    const res = await fetch('clock', { cache: 'no-store', signal: AbortSignal.timeout(1500) });
    const receivedAt = performance.now();
    const stamp = res.headers.get('x-baguette-clock-ms');
    if (!res.ok || !stamp || !Number.isFinite(Number(stamp))) return null;
    return { originMs: Number(stamp) - (sentAt + receivedAt) / 2,
      uncertaintyMs: Math.ceil((receivedAt - sentAt) / 2) + 1 };
  }
  const samples = await Promise.allSettled([sample(), sample(), sample()]);
  return samples.flatMap(result => result.status === 'fulfilled' && result.value ? [result.value] : [])
    .sort((a, b) => a.uncertaintyMs - b.uncertaintyMs)[0];
}

function measureFreezes(frames, startedAt, endedAt, timeOrigin) {
  const freezes = [];
  let previous = startedAt;
  let totalFreezeMs = 0;
  function record(end, recovered) {
    if (end - previous <= 200) return;
    const durationMs = Math.round(end - previous);
    freezes.push({ startedAtMs: Math.round(timeOrigin + previous),
      recoveredAtMs: recovered ? Math.round(timeOrigin + end) : null, durationMs });
    totalFreezeMs += durationMs;
  }
  for (const frame of frames) {
    if (frame <= startedAt) continue;
    if (frame > endedAt) break;
    record(frame, true);
    previous = frame;
  }
  record(endedAt, false);
  const freezesPerMin = endedAt > startedAt ? +(freezes.length * 60_000 / (endedAt - startedAt)).toFixed(2) : 0;
  return { freezes, totalFreezeMs, freezesPerMin };
}

function freezeSummary(startedAt, endedAt) {
  return {
    viewerID: R.viewerID ?? null,
    freezeClock: R.clock ? 'server' : 'browser',
    clockUncertaintyMs: R.clock?.uncertaintyMs ?? null,
    ...measureFreezes(R.frames, startedAt, endedAt, R.clock?.originMs ?? performance.timeOrigin),
  };
}

async function bw(secs) {
  await new Promise(r => setTimeout(r, 3000));
  const a = await counter(), f0 = R.frames.length, t0 = performance.now();
  await new Promise(r => setTimeout(r, secs * 1000));
  const z = await counter(), endedAt = performance.now(), dt = (endedAt - t0) / 1000;
  // per-packet overhead below the counted bytes: WS = TCP/IP + WS header per ~1448 B segment; WebRTC = UDP/IP + SRTP auth tag per packet
  const payload = z.b - a.b, packets = z.p - a.p;
  const wire = T === 'ws' ? payload + Math.ceil(payload / 1448) * 52 + packets * 4 : payload + packets * (28 + 10);
  return finish({ transport: T, sender: R.sender, format: R.format || 'h264', secs: +dt.toFixed(1), payloadMbps: +(payload * 8 / dt / 1e6).toFixed(2), wireMbpsEst: +(wire * 8 / dt / 1e6).toFixed(2),
    mbPerMin: +(wire / dt * 60 / 1e6).toFixed(1), messagesOrPackets: packets, fps: +((R.frames.length - f0) / dt).toFixed(1),
    ...freezeSummary(t0, endedAt) }, false);
}
async function run() {
  // One encoder per run: the WHEP source runs only for WebRTC.
  await fetch('bridge/' + (T === 'webrtc' && SPIKE ? 'on' : 'off'), { method: 'POST' });
  const calibration = T === 'webrtc' && !PION && !SPIKE && WHEP.startsWith('/api/') ? calibrateClock() : undefined;
  if (T === 'webrtc' && SPIKE) { log('starting the spike\'s WHEP source…'); await new Promise(r => setTimeout(r, 5000)); }
  T === 'ws' ? startWS() : await startWebRTC();
  for (const until = performance.now() + 15000; R.firstFrame === null; await new Promise(r => setTimeout(r, 50)))
    if (performance.now() > until) throw new Error('no picture within 15 s');
  R.clock = await calibration;
  if (BANDWIDTH_ONLY) return bw(+(q.get('secs') || 30));
  await new Promise(r => setTimeout(r, 2000));
  // The probe needs the tap probe page on screen: anything already lit at the centre would make every
  // "tap" just the time to the next frame.
  if (!black(last) && await until(black, 3000) === null) {
    log('ABORTED: the screen centre is not black. Put the "Tap probe" page on the simulator first.');
    R.summary = { transport: T, aborted: 'probe page not on screen' }; R.done = true; R.stop(); return;
  }
  const startedAt = performance.now();
  for (let i = 0; i < TAPS; i++) {
    if (!black(last)) await until(black, 5000);
    await new Promise(r => setTimeout(r, 250 + Math.random() * 200));  // de-phase taps from vsync
    // Alternate sides: this tap's answer is its own colour, so a late answer to the last tap
    // (the other colour) is never counted for this one. Waits 5 s, so a stall is measured, not missed.
    const side = i % 2 ? 'right' : 'left';
    const t0 = performance.now(); tap(side);
    const t1 = await until(side === 'left' ? red : green, 5000);
    R.samples.push(t1 === null ? null : t1 - t0);
    // Where the tap's frame spent its time, by Chrome's own clock (requestVideoFrameCallback metadata):
    // tap → first packet received (the sender's side) · decode · received → shown (the receiver's side).
    const m = R.hitMeta; R.hitMeta = null;
    if (t1 !== null && m?.receiveTime) (R.stages ||= []).push({ received: m.receiveTime - t0, decodeMs: (m.processingDuration || 0) * 1000, shown: t1 - t0 });
    if (i % 10 === 9) log('tap', i + 1, t1 === null ? 'MISS' : (t1 - t0).toFixed(1) + ' ms');
  }
  const freeze = freezeSummary(startedAt, performance.now());
  if (TAP_PATH === 'socket') inputSocket();
  const ok = R.samples.filter(x => x !== null);
  if (!ok.length) return finish({ transport: T, sender: R.sender, taps: TAPS, misses: TAPS, failed: 'no tap was answered within 5 s', ...freeze });
  const iv = R.frames.slice(1).map((t, i) => t - R.frames[i]);
  const mean = iv.reduce((a, b) => a + b, 0) / iv.length;
  const durMin = (R.frames.at(-1) - R.frames[0]) / 60000;
  return finish({
    transport: T, sender: R.sender, tapPath: R.tapPath, format: R.format || 'h264', taps: TAPS, misses: TAPS - ok.length,
    p50: +pct(ok, 50).toFixed(1), p95: +pct(ok, 95).toFixed(1), p99: +pct(ok, 99).toFixed(1), min: +Math.min(...ok).toFixed(1), max: +Math.max(...ok).toFixed(1),
    firstFrameMs: +R.firstFrame.toFixed(0), presentedFps: +(1000 / mean).toFixed(1),
    intervalStddevMs: +Math.sqrt(iv.reduce((a, b) => a + (b - mean) ** 2, 0) / iv.length).toFixed(2),
    ...freeze,
    ...stageSummary(),
  });
}
function stageSummary() {
  const st = R.stages || []; if (!st.length) return {};
  const med = a => +pct(a, 50).toFixed(1);
  return { stages: { n: st.length, tapToReceivedP50: med(st.map(x => x.received)), decodeP50: med(st.map(x => x.decodeMs)),
    receivedToShownP50: med(st.map(x => x.shown - x.received)), tapToReceivedP90: +pct(st.map(x => x.received), 90).toFixed(1) } };
}
// Every run ends with a summary and its session closed, even one that fails.
// What the browser lost and got back: lost packets, the NACKs it sent, the resends that arrived, the pictures it asked for.
async function lossStats() {
  const out = {};
  try {
    (await R.pc.getStats()).forEach(r => {
      if (r.type !== 'inbound-rtp' || r.kind !== 'video') return;
      Object.assign(out, { packetsLost: r.packetsLost, nacksSent: r.nackCount, resendsReceived: r.retransmittedPacketsReceived, keyframesAsked: r.pliCount + (r.firCount || 0),
        fecReceived: r.fecPacketsReceived, fecDiscarded: r.fecPacketsDiscarded, size: r.frameWidth && r.frameHeight ? r.frameWidth + 'x' + r.frameHeight : undefined,
        framesReceived: r.framesReceived, framesDecoded: r.framesDecoded, framesDropped: r.framesDropped,
        jitterBufferMs: r.jitterBufferEmittedCount ? Math.round(1000 * r.jitterBufferDelay / r.jitterBufferEmittedCount) : undefined,
        codecId: r.codecId });
    });
    if (out.codecId) { const c = (await R.pc.getStats()).get(out.codecId); out.codec = c?.mimeType; }
    delete out.codecId;
  } catch {}
  return out;
}
// Every summary ends here — a tap run's, a bandwidth run's, a failure's — with the browser's loss counters, read
// before the session closes. `pretty`: a tap run's summary is indented, a bandwidth run's is one line.
async function finish(summary, pretty = true) {
  if (R.pc) Object.assign(summary, await lossStats());
  // A WebRTC run's format is the codec the browser decoded, not the default label.
  if (summary.codec && summary.format) summary.format = summary.codec.replace('video/', '').toLowerCase();
  // `fixture=small`: which probe page the simulator shows (the runner says; the page can't see it).
  if (q.get('fixture')) summary.fixture = q.get('fixture');
  R.summary = summary; log(pretty ? JSON.stringify(summary, null, 1) : JSON.stringify(summary)); R.done = true; R.stop?.();
}
run().catch(e => finish({ transport: T, sender: R.sender, tapPath: R.tapPath, failed: e.message }));
</script></body></html>
