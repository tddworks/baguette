<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Home Screen web app. "Add to Home Screen" (Safari, or Chrome via
     Share) saves the page as it is — with `?handheld=1` when the stream
     is held in the hand — and opens it with no browser bars. The status
     bar turns translucent so the stream can sit under it; handheld mode
     sets `viewport-fit=cover` itself. See docs/features/handheld/. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Simulators — ASC Pro</title>
<!-- Vendored Leaflet stylesheet for the location map picker. The
     library + CSS are served locally; only OSM tiles are fetched at
     runtime. -->
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">

<style>
  /* Minimal tokens so the injected devices-list / devices-stream markup renders
     with a consistent look standalone (outside the host SPA). Mirrors
     the variables the legacy CSS expects. */
  :root {
    --bg:        #f8fafc;
    --panel:     #ffffff;
    --text:      #334155;
    --text-muted:#94a3b8;
    --border:    #e2e8f0;
    --border-light: rgba(15,23,42,0.06);
    --accent:    #2563eb;
    --success:   #0f766e;
    --danger:    #b91c1c;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
               font: 400 13px/1.4 -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif; }
  body { min-height: 100vh; }
</style>
</head>
<body>
<!--
  Standalone simulator entry. Each script owns one job; they're loaded
  in dependency order:

    1. sim-input.js       — SimInput / PinchOverlay / MouseGestureSource
    2. frame-decoder.js   — MJPEG / AVCC byte → frame strategy
       stream-format.js   — which of the two a session may run at
    3. device-frame.js    — bezel + screen-area DOM construction
    4. capture-gallery.js — screenshot fetch + composite + thumbs
    5. stream-session.js  — WebSocket lifetime + paint loop
    6. page/devices-stream.js      — orchestrator: registers `stream` affordance,
                            wires the modules above on Stream click
    7. page/devices-list.js        — list page UI + boot/shutdown buttons

  Each file is a self-contained IIFE that hangs its public surface
  on `window`. No bundler, no module graph; just `<script>` tags.
-->
<!-- Absolute paths so the page resolves siblings the same way whether
     it was loaded at /simulators (list) or /simulators/<udid> (stream).
     Relative `<script src="…">` against /simulators/<udid> would resolve
     to `/simulators/<file>.js`, which the `/simulators/:udid` route
     happily answers with sim.html — leaving the browser to parse HTML
     as JS and throw `Unexpected token '<'`. -->
<!-- The base-path seam: simulators vs physical devices. Must load
     before every module that builds a resource URL. -->
<script src="/wire/target.js"></script>
<script src="/device/device-badge.js"></script>
<script src="/families/mac/internal/mac-frame-choices.js"></script>
<script type="module" src="/families/families.js"></script>
<script type="module" src="/page/page-panels.js"></script>
<script type="module" src="/page/devices-list-share.js"></script>
<script type="module" src="/capture/capture-controls.js"></script>
<script type="module" src="/page/internal/toolbar-view.js"></script>
<script src="/families/mac/internal/local-pointer.js"></script>
<script src="/families/mac/internal/pointer-shape.js"></script>
<script src="/wire/frame-decoder.js"></script>
<!-- Filters the stored format against frame-decoder.js's capability
     probe; must load before page/devices-stream.js / page/device-page.js. -->
<script src="/wire/stream-format.js"></script>
<!-- Shared capture-size vocabulary (Resources/Web/capture/). These must
     load BEFORE capture-gallery.js / recorder.js / page/devices-stream.js: the
     picker and both capture surfaces read `window.Baguette._CaptureSize`
     and `_CaptureSettings` at construction time. Order inside the group
     matters too — settings parses a size, the menu renders settings. -->
<script src="/capture/capture-size.js"></script>
<script src="/capture/capture-settings.js"></script>
<script src="/capture/capture-composer.js"></script>
<script src="/capture/capture-size-menu.js"></script>
<!-- Toolbar cluster folding (Resources/Web/toolbar/). Must load before
     page/device-page.js, which builds the clusters at init and needs
     `window.Baguette._ToolbarFold` to decide what folds. -->
<script src="/toolbar/toolbar-fold.js"></script>
<script src="/handheld/handheld-mode.js"></script>
<script src="/handheld/handheld-button.js"></script>
<script src="/capture/capture-gallery.js"></script>
<script src="/capture/recorder.js"></script>
<script src="/wire/stream-session.js"></script>
<script src="/wire/whep-session.js"></script>
<script src="/panels/logs/internal/log-view.js"></script>
<script src="/page/internal/accessibility-inspector.js"></script>
<script src="/panels/camera/internal/camera-view.js"></script>
<script src="/panels/status-bar/internal/status-bar-view.js"></script>
<!-- Network conditioning. `network/network-condition-form.js` is the value
     type (which of the three mutually exclusive sources a request states);
     `sim-network.js` is the card that draws it, and must load after it. -->
<script src="/panels/network/internal/network-condition-form.js"></script>
<script src="/panels/network/internal/network-view.js"></script>
<!-- App defaults. `defaults/preference-rows.js` shapes rows and request
     bodies; `sim-defaults.js` is the card that draws them, and loads after. -->
<script src="/panels/defaults/internal/preference-rows.js"></script>
<script src="/panels/defaults/internal/defaults-view.js"></script>
<script src="/panels/notify/internal/notify-view.js"></script>
<script src="/page/internal/file-drop.js"></script>
<script src="/page/internal/device-3d.js"></script>
<!-- Plugin contributions. Renders manifest-declared toolbar buttons +
     panels from /plugins.json. Host-rendered only: no plugin script,
     CSS or markup is ever loaded into this page. `page/internal/plugins/plugin-row-action.js`
     carries the click semantics, `page/internal/plugins/plugin-prompt.js` the text-field
     semantics and `page/internal/plugins/plugin-control.js` the tick semantics; all three must
     load first. -->
<script src="/page/internal/plugins/plugin-row-action.js"></script>
<script src="/page/internal/plugins/plugin-prompt.js"></script>
<script src="/page/internal/plugins/plugin-control.js"></script>
<script src="/page/internal/plugins/plugins-rail.js"></script>
<!-- Companion screens — the CarPlay display and the paired Apple Watch,
     offered from their own rail. `families/simulator/internal/companion-screens.js` is the
     value type (availability + instructions); `families/simulator/internal/screens-rail.js` is the
     rail that draws it, and must load after it. -->
<script src="/families/simulator/internal/companion-screens.js"></script>
<script src="/families/simulator/internal/screens-rail.js"></script>
<!-- Leaflet (vendored) + the location map picker. Leaflet must load
     before sim-location.js, which is itself lazy-used by page/device-page.js
     on first open of the location card. -->
<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/panels/location/internal/location-view.js"></script>
<!-- Baguette SDK (the new shape — see Resources/Web/baguette/). The
     page-level scripts below (page/devices-stream.js, page/device-page.js) consume the
     SDK via `Baguette.use({...}).mount(...)`. Load order matters:
     each part IIFE attaches to `window.Baguette` and the entry
     `baguette.js` reads them. -->
<script src="/baguette/transport.js"></script>
<script src="/baguette/gestures/gesture-envelope.js"></script>
<script src="/baguette/gestures/pinch-overlay.js"></script>
<script src="/baguette/gestures/screen-quad.js"></script>
<script src="/baguette/gestures/screen-pieces.js"></script>
<script src="/baguette/gestures/edge-bands.js"></script>
<script src="/baguette/gestures/attachable-event-source.js"></script>
<script src="/baguette/gestures/touch-gesture-source.js"></script>
<script src="/baguette/gestures/wheel-gesture-source.js"></script>
<script src="/baguette/gestures/hover-gesture-source.js"></script>
<script src="/baguette/gestures/safari-gesture-event-source.js"></script>
<script src="/baguette/gestures/mouse-gesture-source.js"></script>
<script src="/baguette/gestures/option-hover-preview.js"></script>
<script src="/baguette/gestures/pointer-interpreter.js"></script>
<script src="/baguette/parts/bezel.js"></script>
<script src="/baguette/parts/screen.js"></script>
<script src="/baguette/parts/button.js"></script>
<script src="/baguette/parts/keyboard.js"></script>
<script src="/baguette/carplay/frame-definition.js"></script>
<script src="/baguette/carplay/frame-registry.js"></script>
<script src="/baguette/carplay/carplay-frame.js"></script>
<script src="/baguette/simulator.js"></script>
<script src="/baguette/baguette.js"></script>
<script src="/page/devices-stream.js"></script>
<!-- page/device-page.js must run BEFORE page/devices-list.js: it sets the
     `__baguetteNativeMode` flag synchronously when the URL is a
     /simulators/<udid> deep link, which page/devices-list.js checks at the
     top of its IIFE to bail out cleanly. Order matters here. -->
<script src="/page/device-page.js"></script>
<script src="/page/internal/device-filter.js"></script>
<script src="/page/devices-list.js"></script>
</body>
</html>
