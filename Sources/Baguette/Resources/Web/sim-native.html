<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulator — focus</title>
<style>
  /* Standalone preview tokens — at runtime sim-native.js extracts the
     #simNativeView block + sibling <style>, so this :root only matters
     when this file is opened directly via file://. */
  :root {
    --bg: #f8fafc;
    --text: #334155;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
               font: 400 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, sans-serif; }
</style>
</head>
<body>
<!--
  Focus mode template. sim-native.js extracts everything inside
  #simNativeView (plus the <style> below) and injects it when the
  page is loaded directly at /simulators/<udid>.

  No fake window, no bottom HUD. The whole UI is one slim
  translucent bar at the top carrying every control:

    [← iPhone 17 Pro Max · iOS 26.4]    [60 fps  H.264|MJPEG  🏠 📷 🪟]

  The device floats free on the dark page below — biggest possible
  device, least possible chrome.
-->
<style>
  /* Theme tokens — defaults are dark; the prefers-color-scheme:
     light media query at the bottom flips them. Native form
     controls also pick up `color-scheme` so scrollbars / focus
     rings match the surrounding theme. */
  #simNativeView {
    color-scheme: light dark;
    --nv-page-bg:        #1a1a1f;
    --nv-bar-bg:         rgba(20, 20, 24, 0.78);
    --nv-bar-border:     rgba(255, 255, 255, 0.08);
    --nv-bar-shadow:     0 8px 24px rgba(0, 0, 0, 0.45);
    --nv-bar-inset:      0 1px 0 rgba(255, 255, 255, 0.05) inset;
    --nv-text:           #f5f5f7;
    --nv-text-muted:     rgba(245, 245, 247, 0.55);
    --nv-text-faint:     rgba(245, 245, 247, 0.5);
    --nv-divider:        rgba(255, 255, 255, 0.12);
    --nv-btn-hover:      rgba(255, 255, 255, 0.10);
    --nv-btn-active:     rgba(255, 255, 255, 0.18);
    --nv-fmt-track-bg:   rgba(255, 255, 255, 0.06);
    --nv-fmt-track-border: rgba(255, 255, 255, 0.06);
    --nv-fmt-btn-text:   rgba(245, 245, 247, 0.65);
    --nv-accent:         #2563eb;
    --nv-accent-text:    #fff;
    /* Status colours and the modal scrim. Both themes get a value for
       the same reason the rest of this block exists: a panel reporting
       an error picked its own red before these were here, and the one
       it picked was a light-theme red on a near-black page. */
    --nv-danger:         #f87171;
    --nv-warn:           #fbbf24;
    --nv-scrim:          rgba(0, 0, 0, 0.55);

    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 12px;
    box-sizing: border-box;
    background: var(--nv-page-bg);
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  /* Light + dark token blocks. Defined as both a media query (for
     "follow system" mode) and a `data-theme` attribute selector
     (for the manual toggle). The attribute selector has higher
     specificity than the media query, so a user-pinned theme
     wins over the OS preference. */
  @media (prefers-color-scheme: light) {
    #simNativeView:not([data-theme="dark"]) {
      --nv-page-bg:        #f1f3f6;
      --nv-bar-bg:         rgba(255, 255, 255, 0.82);
      --nv-bar-border:     rgba(15, 23, 42, 0.08);
      --nv-bar-shadow:     0 6px 22px rgba(15, 23, 42, 0.12);
      --nv-bar-inset:      0 1px 0 rgba(255, 255, 255, 0.7) inset;
      --nv-text:           #1d1d1f;
      --nv-text-muted:     rgba(29, 29, 31, 0.65);
      --nv-text-faint:     rgba(29, 29, 31, 0.55);
      --nv-divider:        rgba(15, 23, 42, 0.14);
      --nv-btn-hover:      rgba(15, 23, 42, 0.06);
      --nv-btn-active:     rgba(15, 23, 42, 0.12);
      --nv-fmt-track-bg:   rgba(15, 23, 42, 0.06);
      --nv-fmt-track-border: rgba(15, 23, 42, 0.06);
      --nv-fmt-btn-text:   rgba(29, 29, 31, 0.65);
      --nv-danger:         #b91c1c;
      --nv-warn:           #b45309;
      --nv-scrim:          rgba(15, 23, 42, 0.32);
    }
    #simNativeView:not([data-theme="dark"]) .carplay-frame,
    #simNativeView:not([data-theme="dark"]) .watch-frame {
      border-color: rgba(15, 23, 42, 0.14);
      box-shadow: 0 14px 36px rgba(15, 23, 42, 0.14);
    }
  }
  #simNativeView[data-theme="light"] {
    --nv-page-bg:        #f1f3f6;
    --nv-bar-bg:         rgba(255, 255, 255, 0.82);
    --nv-bar-border:     rgba(15, 23, 42, 0.08);
    --nv-bar-shadow:     0 6px 22px rgba(15, 23, 42, 0.12);
    --nv-bar-inset:      0 1px 0 rgba(255, 255, 255, 0.7) inset;
    --nv-text:           #1d1d1f;
    --nv-text-muted:     rgba(29, 29, 31, 0.65);
    --nv-text-faint:     rgba(29, 29, 31, 0.55);
    --nv-divider:        rgba(15, 23, 42, 0.14);
    --nv-btn-hover:      rgba(15, 23, 42, 0.06);
    --nv-btn-active:     rgba(15, 23, 42, 0.12);
    --nv-fmt-track-bg:   rgba(15, 23, 42, 0.06);
    --nv-fmt-track-border: rgba(15, 23, 42, 0.06);
    --nv-fmt-btn-text:   rgba(29, 29, 31, 0.65);
    --nv-danger:         #b91c1c;
    --nv-warn:           #b45309;
    --nv-scrim:          rgba(15, 23, 42, 0.32);
  }
  #simNativeView[data-theme="light"] .carplay-frame,
  #simNativeView[data-theme="light"] .watch-frame {
    border-color: rgba(15, 23, 42, 0.14);
    box-shadow: 0 14px 36px rgba(15, 23, 42, 0.14);
  }

  /* Phone | companion screens side-by-side. Each column keeps its own
     intrinsic width; the row centers in the viewport.
     `data-companions` on the root carries which panes are open as a
     space-separated list, so the size budget below can react to the
     count rather than every column claiming half the viewport whether
     or not anything is beside it. */
  #simNativeView .dual-pane {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 28px;
    max-width: 100%;
    max-height: 100%;
    min-width: 0;
  }

  /* --- The size budget -----------------------------------------------
     One place decides how much room the device and each companion pane
     may take, because the answer depends on facts spread across the
     page: how wide the window is, whether the panes are side by side or
     stacked, and how many are open. Expressing that as four variables
     keeps the `!important` overrides below (which fight the SDK Bezel's
     own inline caps) down to one rule each.

     Alone, the device gets the window. It only gives up half when
     something is actually next to it — previously it was pinned to
     46vw at all times, so a phone with no CarPlay pane rendered at half
     size on a laptop and at a *third* of the screen once the narrow
     breakpoint stacked the columns.

     `--nv-vh` is the viewport-height unit the budget is written in.
     `dvh` (dynamic viewport height) is the one we want — it subtracts
     iOS Safari's URL bar and bottom toolbar instead of letting them
     overlay the bezel — but a custom property can't carry the old
     `vh`-then-`dvh` double declaration the rest of this file uses,
     since both parse fine and the later one always wins. `@supports`
     asks the question directly instead.

     Every width carries a `100%` term. The vw shares are a *share of
     the window*, but the column they land in has already given up a
     gutter to the right-edge rails — without the `100%` bound a pane
     claims its full share and slides back under them, which is exactly
     what it did at the narrowest widths. */
  #simNativeView {
    --nv-vh: 1vh;
    --nv-device-max-w:    min(100%, 96vw);
    --nv-device-max-h:    calc(100 * var(--nv-vh) - 68px);
    --nv-companion-max-w: min(100%, 720px, 88vw);
    --nv-companion-max-h: calc(100 * var(--nv-vh) - 68px);
  }
  @supports (height: 1dvh) {
    #simNativeView { --nv-vh: 1dvh; }
  }
  /* The shares add up to 88vw, not 100: the gaps between columns and
     the right-edge rails need the remainder, and a row that adds up to
     the whole window overflows it and slides under them. */
  #simNativeView[data-companions] {
    --nv-device-max-w:    min(100%, 46vw);
    --nv-companion-max-w: min(100%, 720px, 42vw);
  }
  /* Two panes open: three columns share one row. */
  #simNativeView[data-companions~="external"][data-companions~="watch"] {
    --nv-device-max-w:    min(100%, 30vw);
    --nv-companion-max-w: min(100%, 560px, 29vw);
  }
  /* Keep the panes clear of the fixed right-edge rails. Padding on the
     row rather than a narrower budget, so the group stays optically
     centred in what's left of the window instead of straddling them.
     Unconditional: the device is no longer pinned to half the window,
     so on a wide screen it can now reach the rails on its own. */
  #simNativeView .dual-pane { padding-right: 58px; }

  /* SwiftUI-style VStack: toolbar pill above the device, both
     centered horizontally, stacked vertically with a small gap.
     Each child keeps its own intrinsic width; nothing stretches
     to match the other. */
  #simNativeView .device-column {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    max-height: 100%;
    min-width: 0;
    /* A column shrink-wraps its widest child, so without this the
       toolbar pill set the column's width and a `100%` inside it
       resolved against the pill itself — no constraint at all. Capping
       the column against the row gives that percentage something real
       to measure, and stops the pill hanging off both edges. */
    max-width: 100%;
  }

  #simNativeView .companion-column {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    max-height: 100%;
    min-width: 0;
    max-width: 100%;
    flex-shrink: 1;
  }
  #simNativeView .companion-column[hidden] { display: none; }

  #simNativeView .companion-label {
    height: 36px;
    display: inline-flex;
    align-items: center;
    padding: 0 14px;
    border-radius: 999px;
    background: var(--nv-bar-bg);
    border: 1px solid var(--nv-bar-border);
    box-shadow: var(--nv-bar-shadow), var(--nv-bar-inset);
    backdrop-filter: blur(18px) saturate(1.5);
    -webkit-backdrop-filter: blur(18px) saturate(1.5);
    color: var(--nv-text-muted);
    font: 600 12px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, sans-serif;
    letter-spacing: 0.02em;
    flex-shrink: 0;
  }

  /* Plain landscape rect (~16:9). Mounted brands swap aspect via
     .carplay-frame__wrapper and drop the plain border. */
  #simNativeView .carplay-frame {
    position: relative;
    aspect-ratio: 16 / 9;
    width: var(--nv-companion-max-w);
    max-height: var(--nv-companion-max-h);
    background: #0a0a0c;
    border: 2px solid rgba(255, 255, 255, 0.14);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
    outline: none;
    flex-shrink: 1;
  }
  #simNativeView .carplay-frame.carplay-frame--mounted {
    aspect-ratio: auto;
    border-color: transparent;
    border-radius: 0;
    background: transparent;
  }
  #simNativeView .carplay-frame__wrapper {
    position: relative;
    width: 100%;
    height: auto;
    max-height: var(--nv-companion-max-h);
  }
  #simNativeView .carplay-frame canvas,
  #simNativeView .watch-frame canvas {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    pointer-events: none;
  }

  /* The watch is sized from its height, not the width budget: a watch
     stretched to a CarPlay display's share of the row would be absurd,
     and the tall aspect means height is what actually runs out first.

     The ratio here is only the placeholder an empty pane wears; every
     model has its own (a 46mm is 416×496), so sim-native.js replaces it
     inline from the first frame's reported size. */
  #simNativeView .watch-frame {
    position: relative;
    aspect-ratio: 41 / 50;
    /* 44px of the pane's height budget belongs to the button row below. */
    height: min(430px, calc(var(--nv-companion-max-h) - 44px));
    width: auto;
    max-width: min(100%, 34vw);
    background: #0a0a0c;
    border: 2px solid rgba(255, 255, 255, 0.14);
    border-radius: 15%/12%;
    overflow: hidden;
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
    outline: none;
    flex-shrink: 1;
  }

  /* Toolbar pill — its own content-based width (label + controls).
     Sits directly above the device as the upper child of the
     VStack. */
  #simNativeView .top-bar {
    display: inline-flex; align-items: center;
    box-sizing: border-box;   /* so the max-width below is the real width */
    flex-shrink: 0;
    gap: 12px;
    /* One line, always. A second row was tried — the pane baguette is
       squeezed into is narrow and tall, so height looked like the
       cheap dimension — and it is not worth having: a pill with a
       short identity row above a long control row is lopsided, and it
       pushes the device down for controls that fold perfectly well
       into a menu. Folding is the answer to a narrow bar; wrapping is
       a different-looking bar. */
    height: 36px;
    padding: 4px 6px 4px 4px;
    background: var(--nv-bar-bg);
    border: 1px solid var(--nv-bar-border);
    border-radius: 999px;
    box-shadow: var(--nv-bar-shadow), var(--nv-bar-inset);
    backdrop-filter: blur(18px) saturate(1.5);
    -webkit-backdrop-filter: blur(18px) saturate(1.5);
    color: var(--nv-text);
    /* Never wider than the device is allowed to be. The pill sits in
       the same column as the bezel and sizes to its contents, so
       without this it — not the device — set the column's width: with
       a companion pane open the toolbar stayed full length, pushed the
       row wider than the window, and slid the pane under the rails
       while clipping its own back button off the left edge. The icon
       strip already scrolls when it doesn't fit, which is exactly the
       behaviour this hands it. */
    max-width: min(100%, var(--nv-device-max-w));
    /* `backdrop-filter` makes the bar its own stacking context, so a
       popover opened inside it (the capture-size chip's) composites at
       the bar's level no matter how high its own z-index goes. Without
       a level of its own the bar sits at 0, which puts the popover
       under the floating cards (z-index 40) and under the device
       wrapper once `applyOrientation` gives it a transform. 50 clears
       both; the bar and the cards never overlap geometrically. */
    position: relative;
    z-index: 50;
  }

  /* `!important` overrides the SDK Bezel's inline `max-height: 70vh`
     on both the wrapper <div> and the bezel <img> — those defaults
     are tuned for the sidebar layout and would cap the device to
     70% of the viewport here. The 68px subtracts the toolbar
     (36px) + column gap (8px) + container padding (24px).

     Uses `dvh` (dynamic viewport height) so iOS Safari's URL bar +
     bottom toolbar are subtracted from the viewport, not overlaid on
     top of the bezel. With plain `vh` the bezel renders behind the
     Safari toolbar and the bottom of the device gets clipped. Falls
     back to `vh` on engines that don't support `dvh`. */
  #simNativeView #nativeDeviceFrame,
  #simNativeView #nativeDeviceFrame > div,
  #simNativeView #nativeDeviceFrame img,
  #simNativeView #nativeDeviceFrame canvas {
    max-height: var(--nv-device-max-h) !important;
    max-width: var(--nv-device-max-w) !important;
  }

  /* Narrow windows: the row becomes a stack, so width stops being the
     contended axis and height starts. Both budgets are redefined here
     rather than in a `!important` override, because an override would
     have had to out-specify the `[data-companions]` rules above — and
     the earlier attempt at this lost that fight silently: the 46vw cap
     below it in the file won at every width, which is what left the
     phone rendering at under half the window on a small screen.

     `dvh` (dynamic viewport height) so iOS Safari's URL bar and bottom
     toolbar are subtracted from the viewport rather than overlaid on
     the bezel; `vh` first as the fallback for engines without it. */
  /* A companion pane that couldn't bind. Sits under the pane rather
     than over it: the empty frame is honest about there being no
     picture, and covering it would hide the one thing that changes when
     the fix works. Sized to the pane so the steps stay readable at any
     width the pane is drawn at. */
  #simNativeView .companion-fault {
    box-sizing: border-box;
    width: min(100%, 380px);
    padding: 11px 13px 12px;
    background: var(--nv-bar-bg);
    border: 1px solid var(--nv-bar-border);
    border-radius: 12px;
    box-shadow: var(--nv-bar-shadow), var(--nv-bar-inset);
    backdrop-filter: blur(18px) saturate(1.5);
    -webkit-backdrop-filter: blur(18px) saturate(1.5);
    color: var(--nv-text);
    flex-shrink: 0;
  }
  #simNativeView .companion-fault-title {
    font: 600 11.5px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    color: #fbbf24;                 /* amber: the screen is fine, the wiring isn't */
    margin-bottom: 7px;
  }
  #simNativeView .companion-fault-steps {
    margin: 0 0 9px; padding-left: 16px;
    display: flex; flex-direction: column; gap: 5px;
    font: 400 11.5px/1.45 -apple-system, sans-serif;
    color: var(--nv-text-muted);
  }
  #simNativeView .companion-fault-steps li { overflow-wrap: anywhere; }
  #simNativeView .companion-fault-raw {
    display: block;
    font: 500 10.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--nv-text-faint);
    overflow-wrap: anywhere;
    user-select: all; -webkit-user-select: all;
  }

  /* The watch's hardware buttons, as a glass pill under its pane —
     same tokens as the toolbar, so the row reads as chrome around the
     device rather than as part of what's on screen. */
  #simNativeView .watch-buttons {
    display: inline-flex; align-items: center; gap: 2px;
    padding: 3px;
    background: var(--nv-bar-bg);
    border: 1px solid var(--nv-bar-border);
    border-radius: 999px;
    box-shadow: var(--nv-bar-shadow), var(--nv-bar-inset);
    backdrop-filter: blur(18px) saturate(1.5);
    -webkit-backdrop-filter: blur(18px) saturate(1.5);
    flex-shrink: 0;
  }
  #simNativeView .watch-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 0 11px; height: 26px;
    appearance: none; -webkit-appearance: none;
    border: 0; border-radius: 999px;
    background: transparent; color: var(--nv-text);
    font: 600 11px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: background 0.12s ease, transform 0.12s ease;
  }
  #simNativeView .watch-btn:hover  { background: var(--nv-btn-hover); }
  #simNativeView .watch-btn:active { background: var(--nv-btn-active); transform: scale(0.96); }
  #simNativeView .watch-btn svg { display: block; color: var(--nv-text-muted); }
  #simNativeView .watch-btn:hover svg { color: inherit; }

  @media (max-width: 960px) {
    #simNativeView,
    #simNativeView[data-companions],
    #simNativeView[data-companions~="external"][data-companions~="watch"] {
      --nv-device-max-w:    min(100%, 92vw);
      --nv-companion-max-w: min(100%, 720px, 92vw);
    }
    /* Stacked and sharing the height: the phone keeps the larger share
       because it is the thing being worked on. The subtractions are the
       chrome between and around the panes — 24px of view padding, the
       36px toolbar, the 36px pane label and four gaps, ~132px in all —
       so one open pane fits without scrolling. Two do scroll, which is
       what the scroll container below is for. */
    #simNativeView[data-companions] {
      --nv-device-max-h:    calc(55 * var(--nv-vh) - 80px);
      --nv-companion-max-h: calc(45 * var(--nv-vh) - 75px);
    }
    #simNativeView .dual-pane {
      flex-direction: column;
      gap: 16px;
      overflow: auto;
      max-height: 100%;
      /* Longhand, not `padding: 4px 0` — the shorthand quietly reset
         the right gutter reserved for the rails above, and the panes
         went straight back under them at this width. */
      padding-top: 4px;
      padding-bottom: 4px;
      /* Not `center`: a centred flex container that overflows spills
         out of BOTH ends, and the top end can't be scrolled back to —
         which quietly cut the top off the toolbar as soon as a pane
         made the stack too tall. Growing downwards keeps every pixel
         reachable. */
      justify-content: flex-start;
    }
    #simNativeView .watch-frame { max-width: min(100%, 60vw); }
  }

  /* Device-frame rotation. The wrapper inside #nativeDeviceFrame
     mirrors the simulator's interface orientation as a CSS
     transform; sim-native.js sets `data-orientation` on the
     container after each rotate-button click. Rotation is purely
     visual — pixel positions inside the screen area stay in the
     device's portrait coord system, and JS wraps the input
     transport + pinch overlay so coords still land where the
     user's cursor is.

     In landscape, the rotated visual width = portrait device
     height; cap the unrotated max-height by viewport width too so
     the rotated bbox fits horizontally on narrow viewports. */
  #simNativeView #nativeDeviceFrame > div {
    transform-origin: center center;
    transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
  }
  /* Rotation is applied as an *inline* transform via JS so each
     rotate-button click is a monotonically increasing 90° step
     (0 → 90 → 180 → 270 → 360 → 450 → …). Per-orientation CSS
     rules would interpolate the numeric difference between the
     OLD value and the NEW value; jumping from
     `portrait-upside-down (180)` to `landscape-right (-90)`
     animates -270° backward instead of +90° forward, which is
     visibly wrong. The CSS only sets `transform-origin` and the
     transition curve; the actual rotation degree comes from
     `rotation-deg` set inline by `applyOrientation` in
     `sim-native.js`. */

  #simNativeView #nativeDeviceFrame[data-orientation="landscape-right"] > div,
  #simNativeView #nativeDeviceFrame[data-orientation="landscape-left"] > div,
  #simNativeView #nativeDeviceFrame[data-orientation="landscape-right"] img,
  #simNativeView #nativeDeviceFrame[data-orientation="landscape-right"] canvas,
  #simNativeView #nativeDeviceFrame[data-orientation="landscape-left"] img,
  #simNativeView #nativeDeviceFrame[data-orientation="landscape-left"] canvas {
    max-height: min(var(--nv-device-max-h), calc(100vw - 32px)) !important;
  }

  /* --- Power card ---------------------------------------------------
     Shown on the device's own screen when the simulator isn't booted.
     The bezel renders normally (chrome comes from `definition.json`,
     which doesn't need a running guest), so the tab still looks like
     the device it is — the glass just carries a Boot button instead of
     a live framebuffer.

     Deliberately black in BOTH themes: a powered-off phone screen is
     black, and the card sits inside the screen cutout, not on the
     page. Built by `sim-native.js` and appended to the SDK's
     screenArea, so it inherits the bezel's border-radius clip. */
  #simNativeView .power-card {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px;
    padding: 8% 12%;
    box-sizing: border-box;
    text-align: center;
    background: radial-gradient(120% 90% at 50% 40%, #17171c 0%, #08080a 100%);
    cursor: default;
    z-index: 5;
    animation: nv-power-in 0.24s ease both;
    /* Type scales with the rendered screen, not the viewport — the
       bezel shrinks on narrow windows and on landscape rotation, and
       `cqw` on the children resolves against this box. */
    container-type: inline-size;
  }
  @keyframes nv-power-in { from { opacity: 0; } to { opacity: 1; } }

  /* No definition for this udid — there's no bezel to sit inside, so
     the card supplies its own phone-shaped silhouette in the empty
     device slot rather than collapsing to nothing.

     Sized from the height so it can never overflow the viewport: the
     width follows from the aspect ratio, the way the real bezel does. */
  #simNativeView .power-card--bare {
    position: relative; inset: auto;
    height: min(640px, calc(100vh - 110px));
    height: min(640px, calc(100dvh - 110px));
    aspect-ratio: 9 / 19.5;
    width: auto;
    max-width: 78vw;
    border-radius: 44px;
    border: 1px solid rgba(255, 255, 255, 0.09);
  }

  #simNativeView .power-card .power-glyph {
    color: rgba(245, 245, 247, 0.85);
    flex-shrink: 0;
  }
  /* Spins while a boot is in flight. */
  #simNativeView .power-card[data-phase="booting"] .power-glyph,
  #simNativeView .power-card[data-phase="starting"] .power-glyph {
    animation: nv-power-spin 1.4s linear infinite;
    color: rgba(245, 245, 247, 0.6);
  }
  @keyframes nv-power-spin { to { transform: rotate(360deg); } }

  #simNativeView .power-card .power-title {
    color: #f5f5f7;
    font: 600 clamp(13px, 4.2cqw, 17px)/1.25 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    letter-spacing: 0.01em;
  }
  #simNativeView .power-card .power-sub {
    color: rgba(245, 245, 247, 0.5);
    font: 500 clamp(10px, 3.2cqw, 12px)/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    max-width: 26ch;
  }
  /* Boot failures — the message from the server, not a generic retry
     prompt. Amber rather than red: the device is fine, the boot isn't. */
  #simNativeView .power-card .power-sub[data-error] {
    color: #fbbf24;
  }

  #simNativeView .power-card .power-btn {
    appearance: none;
    margin-top: 2px;
    padding: 9px 26px;
    border: 0; border-radius: 999px;
    background: var(--nv-accent); color: var(--nv-accent-text);
    font: 600 clamp(11px, 3.4cqw, 13px)/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    cursor: pointer;
    transition: filter 0.12s ease, transform 0.12s ease;
  }
  #simNativeView .power-card .power-btn:hover:not(:disabled) { filter: brightness(1.12); }
  #simNativeView .power-card .power-btn:active:not(:disabled) { transform: scale(0.97); }
  #simNativeView .power-card .power-btn:disabled {
    opacity: 0.45; cursor: default;
  }

  /* Toolbar gating. Every control in the scroll strip (rotate, AX,
     status bar, location, camera, logs, home, screenshot, app
     switcher) and the format picker needs a live guest — dim and
     disable them until the stream is up. The back link, theme
     toggle and sidebar-view toggle stay reachable: those are how the
     user leaves a device that won't boot. */
  #simNativeView[data-power] #nativeToolScroll,
  #simNativeView[data-power] #nativeFormatPicker {
    opacity: 0.35;
    pointer-events: none;
  }
  #simNativeView[data-power] #nativeStatus {
    color: var(--nv-text-faint);
  }

  /* Label group — clickable, returns to the simulator list. The
     chevron + device name + OS subtitle read as one breadcrumb. */
  #simNativeView .tb-label {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 4px 10px 4px 8px;
    border-radius: 999px;
    color: inherit; text-decoration: none;
    transition: background 0.12s ease;
    min-width: 0; /* enable ellipsis inside the flex item */
  }
  #simNativeView .tb-label:hover { background: var(--nv-btn-hover); }
  #simNativeView .tb-label .tb-back {
    color: var(--nv-text-muted);
    flex-shrink: 0;
  }
  #simNativeView .tb-label .tb-name {
    color: var(--nv-text);
    font: 600 13px/1.1 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    letter-spacing: 0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 22ch;
  }
  #simNativeView .tb-label .tb-os {
    color: var(--nv-text-faint);
    font: 500 11px/1.1 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    white-space: nowrap;
    padding-left: 2px;
    border-left: 1px solid var(--nv-divider);
  }

  /* Right-side controls cluster: fps badge · format picker · actions. */
  #simNativeView .tb-controls {
    display: inline-flex; align-items: center; gap: 8px;
    padding-right: 4px;
    min-width: 0;
  }

  /* Horizontally-scrollable icon strip. Trackpads scroll it directly;
     mouse users get the flanking chevron buttons. It's the only flexible
     child of .tb-controls, so it shrinks (and scrolls) when the window is
     too narrow while the label / fps / format stay put. Scrollbar hidden
     for the clean pill look. */
  #simNativeView .tb-scroll {
    display: inline-flex; align-items: center; gap: 2px;
    flex: 0 1 auto;
    min-width: 0;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-behavior: smooth;
    scrollbar-width: none;                 /* Firefox */
  }
  /* Clipping is what makes `scrollWidth` meaningful while ToolbarFold
     tries candidates, and it is worn only for that: a clipped bar also
     cuts off every popover hanging out of it. */
  /* Clipping is what makes `scrollWidth` meaningful while ToolbarFold
     tries candidates, and it is worn only for that: a clipped bar also
     cuts off every popover hanging out of it. */
  #simNativeView .top-bar.measuring { overflow: hidden; }

  /* Once every cluster has folded and merged there is nothing left to
     give but Navigate itself. The OS version goes first — it is a
     caption nobody acts on — and then the device name truncates,
     because a shortened name still says which device while a dropped
     control is simply gone. */
  #simNativeView .top-bar.tight .tb-os { display: none; }
  #simNativeView .top-bar.tight .tb-name { max-width: 92px; }
  #simNativeView .tb-scroll::-webkit-scrollbar { display: none; }  /* WebKit */

  /* ── Cluster folding ────────────────────────────────────────────
     The strip is seven CONTEXT CLUSTERS, not fifteen loose controls:
     Navigate, Stream, View, Control, Simulate, Inspect, Capture. When
     the row runs out of width a whole cluster folds into one menu
     button — never an item, never a partial group. `ToolbarFold`
     (toolbar/toolbar-fold.js) owns the order; this is its dressing.
     See docs/mockups/focus-toolbar-overflow.html. */
  #simNativeView .tb-cluster {
    display: inline-flex; align-items: center; gap: 2px; flex: 0 0 auto;
  }
  #simNativeView .tb-cluster[hidden] { display: none; }
  #simNativeView .tb-sep {
    flex: 0 0 auto; width: 1px; height: 16px; margin: 0 2px;
    background: var(--nv-divider);
  }
  #simNativeView .tb-sep[hidden] { display: none; }

  /* A folded cluster is an ICON plus a caret, never a text label:
     folding has to be a saving, and "Inspect" as a label is an 85px
     button replacing two 30px glyphs. The names still do their work,
     as the menu's section headings and the button's tooltip. */
  #simNativeView .tb-fold { position: relative; flex: 0 0 auto; }
  #simNativeView .tb-fold[hidden] { display: none; }
  #simNativeView .tb-fold-btn {
    display: inline-flex; align-items: center; gap: 1px;
    height: 26px; padding: 0 4px 0 5px;
    background: transparent; border: 1px solid transparent; border-radius: 8px;
    color: var(--nv-text); cursor: pointer;
  }
  #simNativeView .tb-fold-btn:hover { background: var(--nv-btn-hover); }
  #simNativeView .tb-fold-btn[aria-expanded="true"] {
    border-color: var(--nv-accent); color: var(--nv-accent);
  }
  #simNativeView .tb-fold-btn svg { display: block; }
  #simNativeView .tb-fold-btn .tb-caret { opacity: 0.5; }

  /* A cluster menu is anchored under the button that opened it.
     `right: 0` put a 234px popover's right edge on a 40px button, so
     the Stream menu opened almost the full width of the bar to the
     LEFT of the control it belongs to and read as unrelated to it.
     Only the merged menu keeps `right: 0` — it sits at the end of the
     bar, where opening leftward is the only direction available. */
  /* Border-box throughout this menu. sim-native.html does not set a
     global `box-sizing`, so `width: 100%` on a padded row resolved to
     content-width PLUS padding and every row sat a few pixels wider
     than the popover holding it — which is what clipped the frame-rate
     readout against the right border. */
  #simNativeView .tb-fold-pop,
  #simNativeView .tb-row,
  #simNativeView .tb-read,
  #simNativeView .tb-choice,
  #simNativeView .tb-acc > summary,
  #simNativeView .tb-acc-body { box-sizing: border-box; }

  #simNativeView .tb-fold-pop {
    position: absolute; z-index: 60; top: calc(100% + 8px);
    left: 50%; transform: translateX(-50%);
    /* Sized for the widest row a cluster menu holds, which is the
       codec CHOICE — at 208px "MJPEG" was clipped off it. */
    width: 234px; padding: 6px; border-radius: 12px;
    /* Opaque, unlike the bar itself. The toolbar's translucency reads
       as chrome floating over the device; a MENU sits directly on top
       of the running screen, and at `--nv-bar-bg`'s 0.82 alpha the app
       behind it showed through the rows. A control you have to squint
       past a home screen to read is not worth folding into. */
    background: var(--nv-page-bg);
    border: 1px solid var(--nv-bar-border);
    box-shadow: var(--nv-bar-shadow);
    color: var(--nv-text);
    font: 500 12px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    max-height: 60vh; overflow-y: auto;
  }
  #simNativeView [data-fold="more"] .tb-fold-pop {
    left: auto; right: 0; transform: none;
  }
  #simNativeView .tb-fold-pop[hidden] { display: none; }

  /* Merged mode is an EXCLUSIVE accordion. Four clusters flattened
     into one popover is thirteen rows — the "too many things"
     complaint moved down a level rather than answered. Collapsed it is
     four rows; `name=` makes them a radio group where supported and
     the click handler enforces it everywhere else. */
  #simNativeView .tb-acc > summary {
    list-style: none; cursor: pointer;
    display: flex; align-items: center; gap: 9px;
    padding: 8px; border-radius: 8px;
    font: 600 12px/1.3 inherit; color: var(--nv-text);
  }
  #simNativeView .tb-acc > summary::-webkit-details-marker { display: none; }
  #simNativeView .tb-acc > summary:hover { background: var(--nv-btn-hover); }
  #simNativeView .tb-acc > summary svg { flex: 0 0 auto; opacity: 0.8; }
  #simNativeView .tb-acc[open] > summary { color: var(--nv-accent); }
  #simNativeView .tb-acc > summary .tb-acc-n {
    margin-left: auto; font-size: 10px; font-weight: 500;
    color: var(--nv-text-faint); font-variant-numeric: tabular-nums;
  }
  #simNativeView .tb-acc > summary .tb-caret { opacity: 0.5; transition: transform 0.15s ease; }
  #simNativeView .tb-acc[open] > summary .tb-caret { transform: rotate(180deg); }
  #simNativeView .tb-acc-body { padding: 1px 0 5px 8px; }

  /* A MENU ROW IS NOT ONE THING. Flattening every control to
     icon + label + value turned the codec picker into a caption
     reading "Codec H.264" with no way to reach MJPEG. Actions,
     toggles, choices and readouts each get their own rendering. */
  #simNativeView .tb-row {
    display: flex; align-items: center; gap: 9px; width: 100%;
    padding: 7px 8px; border: 0; border-radius: 8px; cursor: pointer;
    background: transparent; color: inherit; font: inherit; text-align: left;
  }
  #simNativeView .tb-row:hover { background: var(--nv-btn-hover); }
  #simNativeView .tb-row svg { flex: 0 0 auto; opacity: 0.85; }
  #simNativeView .tb-row.on { color: var(--nv-accent); }
  #simNativeView .tb-row.on svg { opacity: 1; }
  /* A dot, not a switch. Every control that reaches this menu — status
     bar, location, camera, accessibility, logs — OPENS A PANEL. A
     switch says "a setting you flip and leave"; these are disclosures,
     and the switch also justified keeping the menu open so you could
     watch it move, which left the panel you just opened sitting behind
     the menu covering it. The dot reports the same state without
     claiming to be a setting. */
  #simNativeView .tb-dot {
    margin-left: auto; flex: 0 0 auto;
    width: 6px; height: 6px; border-radius: 999px;
    background: transparent;
  }
  #simNativeView .tb-row.on .tb-dot { background: var(--nv-accent); }

  /* readout — no hover, no pointer: nothing happens when you press it */
  #simNativeView .tb-read {
    display: flex; align-items: center; gap: 9px; width: 100%;
    padding: 7px 8px; cursor: default; color: var(--nv-text-muted);
  }
  #simNativeView .tb-read svg { flex: 0 0 auto; opacity: 0.55; }
  #simNativeView .tb-read span:first-of-type { flex: 0 1 auto; min-width: 0; }
  #simNativeView .tb-read .tb-val {
    margin-left: auto; padding-left: 8px; flex: 0 0 auto;
    font-size: 11px; color: var(--nv-text-faint);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }

  /* choice — the options come with it, because a value you cannot
     change is a caption pretending to be a control */
  #simNativeView .tb-choice {
    display: flex; align-items: center; gap: 9px;
    padding: 6px 8px; border-radius: 8px;
  }
  #simNativeView .tb-choice > svg { flex: 0 0 auto; opacity: 0.85; }
  #simNativeView .tb-choice .fmt-picker { margin-left: auto; }

  /* Chevron scroll buttons — hidden unless the strip overflows. */
  #simNativeView .tb-arrow {
    flex: 0 0 auto;
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 26px; padding: 0;
    background: transparent; border: 0; border-radius: 7px;
    color: var(--nv-text-muted); cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease, opacity 0.12s ease;
  }
  #simNativeView .tb-arrow:hover { background: var(--nv-btn-hover); color: var(--nv-text); }
  #simNativeView .tb-arrow:disabled { opacity: 0.28; cursor: default; background: transparent; }
  #simNativeView .tb-arrow[hidden] { display: none; }
  #simNativeView .tb-arrow svg { display: block; }

  /* fps — small monospace label. Hidden until the stream reports a
     value so the bar isn't carrying dead text on startup. */
  #simNativeView #nativeStatus {
    color: var(--nv-text-muted);
    font: 500 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
    white-space: nowrap;
    padding: 0 2px;
  }
  #simNativeView #nativeStatus:empty { display: none; }

  /* Format segmented control. Active is filled blue; the other is
     a quiet ghost that lifts on hover. */
  #simNativeView .fmt-picker {
    display: inline-flex; align-items: stretch;
    padding: 2px;
    background: var(--nv-fmt-track-bg);
    border: 1px solid var(--nv-fmt-track-border);
    border-radius: 999px;
  }
  #simNativeView .fmt-btn {
    appearance: none; -webkit-appearance: none;
    border: 0; padding: 0 10px; height: 22px;
    background: transparent; color: var(--nv-fmt-btn-text);
    font: 700 10px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    letter-spacing: 0.04em;
    border-radius: 999px; cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease;
  }
  #simNativeView .fmt-btn:hover { color: var(--nv-text); }
  #simNativeView .fmt-btn.active {
    background: var(--nv-accent); color: var(--nv-accent-text);
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.25);
  }
  /* A codec this browser has no decoder for. The `title` says why. */
  #simNativeView .fmt-btn:disabled {
    opacity: 0.35; cursor: not-allowed;
  }
  #simNativeView .fmt-btn:disabled:hover { color: var(--nv-fmt-btn-text); }

  /* Action buttons — Home / Screenshot / App-switcher. */
  #simNativeView .tb-actions {
    display: inline-flex; align-items: center; gap: 2px;
  }
  #simNativeView .ico-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 28px; padding: 0;
    background: transparent; border: 0; border-radius: 8px;
    color: var(--nv-text); cursor: pointer;
    transition: background 0.12s ease;
  }
  #simNativeView .ico-btn:hover { background: var(--nv-btn-hover); }
  #simNativeView .ico-btn:active { background: var(--nv-btn-active); }
  #simNativeView .ico-btn.active { background: var(--nv-accent); color: var(--nv-accent-text); }
  #simNativeView .ico-btn svg { display: block; }

  /* Sidebar-view toggle — floating glass pill on the bottom-left,
     mirror of the theme toggle. Click navigates back to the inline
     sidebar layout (`/simulators#stream=<udid>`) — the
     classic startStream view with the right-hand sidebar of
     buttons + capture gallery. Same tokens as the theme pill so
     the two read as a matched pair. */
  #simNativeView .sidebar-view-toggle {
    position: fixed; left: 16px; bottom: 16px;
    width: 36px; height: 36px;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0;
    background: var(--nv-bar-bg);
    border: 1px solid var(--nv-bar-border);
    border-radius: 999px;
    box-shadow: var(--nv-bar-shadow), var(--nv-bar-inset);
    backdrop-filter: blur(18px) saturate(1.5);
    -webkit-backdrop-filter: blur(18px) saturate(1.5);
    color: var(--nv-text);
    cursor: pointer;
    transition: background 0.12s ease, transform 0.12s ease;
    z-index: 50;
  }
  #simNativeView .sidebar-view-toggle:hover  { background: var(--nv-btn-hover); }
  #simNativeView .sidebar-view-toggle:active { transform: scale(0.96); }
  #simNativeView .sidebar-view-toggle svg { display: block; }

  /* Right-edge rail stack. Two rails live here — baguette's own
     companion-screens rail on top, the plugins rail below — and both
     used to claim `right: 16px; top: 50%` for themselves, which put
     them on top of each other the moment both existed.

     Deliberately NOT centred with `transform: translateY(-50%)`: a
     transformed element becomes the containing block for `position:
     fixed` descendants, and the plugin panel and its flyout are both
     fixed and mounted in here. Full-height plus `justify-content:
     center` centres the group without that side effect.

     This container IS a stacking context, and no `z-index` here can
     change that: `position: fixed` creates one on its own, whatever
     `z-index` says. Everything mounted inside therefore composites at
     the stack's level — the rail's own `z-index` is what the page
     sorts, and a child's is only ever measured against its siblings in
     here. That's fine for the rails, the flyout and the panel, which
     all live at the right edge; it is not fine for anything meant to
     cover the page. The add-a-bakery modal used to mount here and its
     `z-index: 60` was being weighed against the rail rather than
     against the device's `z-index: 2` screen area a level up, so the
     scrim meant to dim the phone painted behind it. Page-covering
     things hang off `#simNativeView` instead — see `modalMount` in
     sim-native.js. */
  #simNativeView .right-rails {
    position: fixed;
    right: 16px; top: 12px; bottom: 12px;
    display: flex; flex-direction: column;
    align-items: flex-end; justify-content: center;
    gap: 10px;
    pointer-events: none;
  }
  #simNativeView .right-rails > * { pointer-events: auto; }
  /* `order` rather than DOM order: both rails are appended by their own
     async fetch, so whichever server answer lands first would otherwise
     decide which rail is on top — and the plugins rail beat the screens
     rail on a warm cache but not a cold one. baguette's own controls go
     above the ones you installed, every time. */
  #simNativeView .right-rails > .screens-rail { order: 1; }
  #simNativeView .right-rails > .plugin-rail  { order: 2; }

  /* Theme toggle — floating glass pill at the bottom-right
     corner. Carries one icon (sun in light theme, moon in dark
     theme); click flips the manual override. The same pill
     tokens as the toolbar so it reads as a sibling control. */
  #simNativeView .theme-toggle {
    position: fixed; right: 16px; bottom: 16px;
    width: 36px; height: 36px;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0;
    background: var(--nv-bar-bg);
    border: 1px solid var(--nv-bar-border);
    border-radius: 999px;
    box-shadow: var(--nv-bar-shadow), var(--nv-bar-inset);
    backdrop-filter: blur(18px) saturate(1.5);
    -webkit-backdrop-filter: blur(18px) saturate(1.5);
    color: var(--nv-text);
    cursor: pointer;
    transition: background 0.12s ease, transform 0.12s ease;
    z-index: 50;
  }
  #simNativeView .theme-toggle:hover  { background: var(--nv-btn-hover); }
  #simNativeView .theme-toggle:active { transform: scale(0.96); }
  /* Show only the icon that matches the active theme. The other
     is collapsed via display: none — both icons live in the DOM
     so screen readers can announce either label. */
  #simNativeView .theme-toggle .ic-sun  { display: none; }
  #simNativeView .theme-toggle .ic-moon { display: block; }
  @media (prefers-color-scheme: light) {
    #simNativeView:not([data-theme="dark"]) .theme-toggle .ic-sun  { display: block; }
    #simNativeView:not([data-theme="dark"]) .theme-toggle .ic-moon { display: none; }
  }
  #simNativeView[data-theme="light"] .theme-toggle .ic-sun  { display: block; }
  #simNativeView[data-theme="light"] .theme-toggle .ic-moon { display: none; }
  #simNativeView[data-theme="dark"]  .theme-toggle .ic-sun  { display: none; }
  #simNativeView[data-theme="dark"]  .theme-toggle .ic-moon { display: block; }

  /* Narrow viewports — drop the OS subtitle and the fps badge so
     the bar collapses gracefully instead of wrapping. */
  @media (max-width: 560px) {
    #simNativeView .tb-label .tb-os { display: none; }
    #simNativeView #nativeStatus { display: none; }
    #simNativeView .top-bar { gap: 8px; }
  }
  @media (max-width: 420px) {
    #simNativeView .fmt-picker { display: none; }
    #simNativeView .tb-label .tb-name { max-width: 16ch; }
  }

  /* Live-log sheet — slides up from the bottom on toggle. Hidden
     by default; the toolbar's `__nativeToggleLogs` flips
     `[data-logs="open"]` on `#simNativeView`. The sheet uses the
     same glass tokens as the toolbar so it reads as a sibling
     control, and the inner panel adopts the Events-card monospace
     styling so colour-coding pops the same way as the sidebar
     view. */
  #simNativeView .logs-sheet {
    position: fixed;
    left: 16px; right: 16px; bottom: 16px;
    max-height: 50vh;
    display: flex; flex-direction: column;
    background: var(--nv-bar-bg);
    border: 1px solid var(--nv-bar-border);
    border-radius: 14px;
    box-shadow: var(--nv-bar-shadow), var(--nv-bar-inset);
    backdrop-filter: blur(18px) saturate(1.5);
    -webkit-backdrop-filter: blur(18px) saturate(1.5);
    color: var(--nv-text);
    transform: translateY(calc(100% + 24px));
    opacity: 0;
    pointer-events: none;
    transition: transform 0.22s cubic-bezier(0.32, 0.72, 0, 1),
                opacity 0.18s ease;
    z-index: 60;
  }
  #simNativeView[data-logs="open"] .logs-sheet {
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
  }
  #simNativeView .logs-sheet[aria-hidden="true"] { display: flex; }
  #simNativeView .logs-sheet-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid var(--nv-divider);
    font: 600 12px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    letter-spacing: 0.02em;
  }
  #simNativeView .logs-sheet-close {
    width: 26px; height: 24px;
    color: var(--nv-text-muted);
  }
  #simNativeView .logs-sheet-body {
    flex: 1; min-height: 0; overflow: hidden;

  #simNativeView .camera-host {

  #simNativeView .status-bar-host {

    width: 332px;

  #simNativeView .status-bar-host-head {

  #simNativeView #nativeStatusBarHost { overflow-y: auto; padding: 2px 14px 12px; }

  /* Network-conditioning card — same floating-glass chrome as the

  #simNativeView .network-host {
    position: absolute;

    z-index: 40;

    max-height: calc(100dvh - 120px);

  #simNativeView .network-host-title {

    padding: 4px 9px; border-radius: 999px;
    border: 1px solid var(--nv-bar-border); background: transparent;
    color: var(--nv-text); font: 500 11.5px/1 -apple-system, sans-serif;
    cursor: pointer;

  #simNativeView .network-host .nw-pill:hover:not(:disabled) { background: rgba(127,127,127,0.14); }

  #simNativeView .network-host .nw-field {

  /* The armed readout. Amber rather than the usual muted grey, because

  #simNativeView .network-host .nw-state {

  /* Toolbar indicator. Mirrors the camera's `.streaming` dot but amber

  #simNativeView #nativeNetworkToggle { position: relative; }
  #simNativeView #nativeNetworkToggle.conditioning::after {
    content: '';
    position: absolute; top: 3px; right: 3px;
    width: 7px; height: 7px;

  /* Location card — same floating-glass chrome as the status-bar card,

  #simNativeView .location-host {
    position: absolute;
    top: 84px;
    right: 24px;
    z-index: 40;
    width: 360px;
    max-height: calc(100dvh - 120px);

    opacity: 0;

  #simNativeView .location-host-head {
    display: flex; align-items: center; justify-content: space-between;

    border-bottom: 1px solid var(--nv-divider);

  #simNativeView .location-host-title {

  #simNativeView .location-host .loc-search {
    display: flex; gap: 6px; margin-bottom: 10px;
  }
  #simNativeView .location-host .loc-search-input {
    flex: 1; min-width: 0; padding: 6px 9px; border-radius: 8px;
    border: 1px solid var(--nv-divider); background: var(--nv-btn-hover);

  #simNativeView .location-host .loc-search-input:focus { outline: none; border-color: var(--nv-accent); }
  #simNativeView .location-host .loc-icon-btn {
    flex: 0 0 auto; width: 30px; display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--nv-divider); border-radius: 8px;

  #simNativeView .location-host .loc-modes {

  #simNativeView .location-host .loc-seg-btn {

  #simNativeView .location-host .loc-seg-btn:hover { color: var(--nv-text); }
  #simNativeView .location-host .loc-seg-btn.active {

  #simNativeView .location-host .loc-map {

  #simNativeView .location-host .loc-readout {

  #simNativeView .location-host .loc-row {
    display: flex; align-items: center; gap: 8px; margin-top: 10px;

  /* `display: flex` above outranks the UA stylesheet's `[hidden] { display:

     screen in every tab even though `_setMode` sets `hidden`. Same trick as
     `.companion-column[hidden]` and `.tb-arrow[hidden]` further up. */
  #simNativeView .location-host .loc-row[hidden] { display: none; }
  #simNativeView .location-host .loc-row-label {
    font: 500 12px/1 -apple-system, sans-serif; color: var(--nv-text-muted);
  }
  #simNativeView .location-host .loc-field {
    width: 72px; padding: 5px 8px; border-radius: 7px;
    border: 1px solid var(--nv-divider); background: var(--nv-btn-hover);
    color: var(--nv-text); font: 500 12px/1 -apple-system, sans-serif;
  }
  #simNativeView .location-host .loc-field:focus { outline: none; border-color: var(--nv-accent); }
  #simNativeView .location-host .loc-unit { font: 500 12px/1 -apple-system, sans-serif; color: var(--nv-text-muted); }
  /* Motion toggle — sits under the readout in every mode, since motion
     follows whatever the card is doing (walk, route, or a pinned point). */
  #simNativeView .location-host .loc-motion { justify-content: space-between; }
  #simNativeView .location-host .loc-motion-toggle {
    display: flex; align-items: center; gap: 6px; cursor: pointer;
    font: 500 12px/1 -apple-system, sans-serif; color: var(--nv-text-muted);
  }
  #simNativeView .location-host .loc-motion-toggle input { accent-color: var(--nv-accent); }
  #simNativeView .location-host .loc-motion-state {
    font: 500 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--nv-accent);

  #simNativeView .location-host .loc-actions { display: flex; gap: 8px; margin-top: 12px; }
  #simNativeView .location-host .loc-apply {
    flex: 1; padding: 8px; border: 0; border-radius: 8px; cursor: pointer;
    background: var(--nv-accent); color: var(--nv-accent-text);

  #simNativeView .location-host .loc-apply:disabled { opacity: 0.45; cursor: default; }
  #simNativeView .location-host .loc-clear {
    padding: 8px 14px; border: 1px solid var(--nv-divider); border-radius: 8px;

  /* CSS-only map pin (a divIcon) so no Leaflet marker PNGs are needed. */
  #simNativeView .location-host .loc-pin-dot {

    background: var(--nv-accent); border: 2px solid #fff;

  #simNativeView .location-host .loc-walk {
    display: flex; align-items: center; gap: 16px; margin-top: 12px;
  }
  /* Keeps the joystick, compass and speed preset out of Point and Route —

  #simNativeView .location-host .loc-walk[hidden] { display: none; }
  /* The pad. `touch-action: none` is load-bearing — without it a drag on

  #simNativeView .location-host .loc-stick {
    position: relative; flex: 0 0 auto;
    width: 96px; height: 96px; border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, var(--nv-btn-hover) 0%, transparent 70%),

    border: 1px solid var(--nv-divider);
    cursor: grab; touch-action: none; user-select: none;

  #simNativeView .location-host .loc-stick:active { cursor: grabbing; }
  #simNativeView .location-host .loc-stick:focus-visible {
    outline: 2px solid var(--nv-accent); outline-offset: 2px;
  }
  #simNativeView .location-host .loc-stick-axis {
    position: absolute; background: var(--nv-divider); opacity: 0.6;
  }
  #simNativeView .location-host .loc-stick-axis-v {
    left: 50%; top: 12%; bottom: 12%; width: 1px; transform: translateX(-0.5px);
  }
  #simNativeView .location-host .loc-stick-axis-h {
    top: 50%; left: 12%; right: 12%; height: 1px; transform: translateY(-0.5px);
  }
  #simNativeView .location-host .loc-stick-thumb {
    position: absolute; left: 50%; top: 50%;
    width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%;
    background: var(--nv-accent); border: 2px solid rgba(255,255,255,0.85);
    box-shadow: 0 2px 8px rgba(0,0,0,0.45);
    /* Snap home on release; while dragging JS sets transform every

    transition: transform 0.12s cubic-bezier(0.2, 0.9, 0.3, 1.4);
    pointer-events: none;

  #simNativeView .location-host .loc-walk-side {

  #simNativeView .location-host .loc-compass {

    border: 1px solid var(--nv-divider); background: var(--nv-btn-hover);
  }
  #simNativeView .location-host .loc-compass-n {
    position: absolute; top: 1px; left: 50%; transform: translateX(-50%);

  #simNativeView .location-host .loc-compass-needle {

  /* Accessibility-inspector floating panel. Sits top-right of the

  #simNativeView .ax-host {

  /* --- Right-edge rails: companion screens + plugins -----------------
     Both rails and everything they open. This lives here, with the rest
     of the focus chrome, rather than in sim-screens.js / sim-plugins.js
     — those used to inject a stylesheet each, and a stylesheet written
     next to its module can't see the token block, so both had to guess
     at a fallback for every colour. The guesses were light-theme values,
     so the rails rendered light-on-dark wherever a token didn't reach,
     and the two rails drifted from each other and from the toolbar.

     The two share every shape below. What tells them apart is one
     thing: the plugin rail's emblem is drawn in the accent, baguette's
     own rail's in the muted text colour. The rails being separate is
     the trust signal (see docs/features/plugins.md); it doesn't need a
     second colour system on top. */
  #simNativeView .screens-rail,
  #simNativeView .plugin-rail {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 8px 6px;
    background: var(--nv-bar-bg);
    border: 1px solid var(--nv-bar-border);
    border-radius: 14px;
    box-shadow: var(--nv-bar-shadow), var(--nv-bar-inset);
    backdrop-filter: blur(18px) saturate(1.5);
    -webkit-backdrop-filter: blur(18px) saturate(1.5);
    color: var(--nv-text);
  }
  /* Emblem cap — names the strip. */
  #simNativeView .screens-rail-cap,
  #simNativeView .plugin-rail-cap {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 24px;
    color: var(--nv-text-muted);
  }
  #simNativeView .plugin-rail-cap { color: var(--nv-accent); }
  #simNativeView .screens-rail-divider,
  #simNativeView .plugin-rail-divider {
    width: 20px; height: 1px; margin: 1px 0 3px;
    background: var(--nv-divider);
  }

  /* Rail buttons are the toolbar's `.ico-btn` in a column — same box,
     same radius, same hover / active / selected treatment. */
  #simNativeView .screens-rail-btn,
  #simNativeView .plugin-rail-btn {
    position: relative;
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 28px; padding: 0;
    background: transparent; border: 0; border-radius: 8px;
    color: var(--nv-text); cursor: pointer;
    transition: background 0.12s ease, opacity 0.12s ease;
  }
  #simNativeView .screens-rail-btn:hover,
  #simNativeView .plugin-rail-btn:hover { background: var(--nv-btn-hover); }
  #simNativeView .screens-rail-btn:active,
  #simNativeView .plugin-rail-btn:active { background: var(--nv-btn-active); }
  #simNativeView .screens-rail-btn.active,
  #simNativeView .plugin-rail-btn.active {
    background: var(--nv-accent); color: var(--nv-accent-text);
  }
  #simNativeView .screens-rail-btn:focus-visible,
  #simNativeView .plugin-rail-btn:focus-visible {
    outline: 2px solid var(--nv-accent); outline-offset: 2px;
  }
  #simNativeView .screens-rail-btn svg,
  #simNativeView .plugin-rail-btn svg { display: block; }
  /* A slot whose flyout is open, but which isn't the open panel. */
  #simNativeView .plugin-rail-btn.expanded { background: var(--nv-btn-hover); }
  /* Dimmed, not hidden: the button is how you find out the screen could
     exist, and how you reach the instructions for attaching one. */
  #simNativeView .screens-rail-btn.unavailable { opacity: 0.38; }
  #simNativeView .screens-rail-btn.unavailable:hover { opacity: 0.7; }
  #simNativeView .screens-rail-refresh { color: var(--nv-text-muted); }
  #simNativeView .plugin-rail-add { color: var(--nv-accent); }
  /* A caret on plugins that hold more than one tool: says "there is
     more here, and it opens leftward" before you hover to find out. */
  #simNativeView .plugin-rail-group::after {
    content: ''; position: absolute; left: 2px; top: 50%;
    margin-top: -3px; border: 3px solid transparent;
    border-right-color: currentColor; opacity: 0.4;
    transition: opacity 0.12s ease;
  }
  #simNativeView .plugin-rail-group:hover::after,
  #simNativeView .plugin-rail-group.expanded::after { opacity: 0.75; }

  /* The flyout listing one plugin's tools, and the companion-screens
     card. Both are `position: fixed` and placed by their module against
     the button that opened them, so only the surface is described here.
     Same glass, radius and motion as the floating panels above. */
  #simNativeView .plugin-flyout,
  #simNativeView .screens-card {
    position: fixed; z-index: 50;
    background: var(--nv-bar-bg);
    border: 1px solid var(--nv-bar-border);
    border-radius: 12px;
    box-shadow: var(--nv-bar-shadow), var(--nv-bar-inset);
    backdrop-filter: blur(18px) saturate(1.5);
    -webkit-backdrop-filter: blur(18px) saturate(1.5);
    color: var(--nv-text);
    animation: nv-rail-pop-in 0.16s ease;
  }
  #simNativeView .plugin-flyout {
    min-width: 172px; max-width: 260px;
    padding: 5px; display: flex; flex-direction: column; gap: 1px;
  }
  #simNativeView .screens-card { width: 268px; }
  @keyframes nv-rail-pop-in {
    from { opacity: 0; transform: translateX(4px); }
    to   { opacity: 1; transform: translateX(0); }

  @media (prefers-reduced-motion: reduce) {
    #simNativeView .plugin-flyout,
    #simNativeView .screens-card { animation: none; }
  }
  /* Micro-heading, same as the status-bar card's section titles. */
  #simNativeView .plugin-flyout-head {
    padding: 6px 8px 7px; margin-bottom: 3px;
    color: var(--nv-text-faint);
    font: 700 9.5px/1 -apple-system, sans-serif;

  #simNativeView .plugin-flyout-item {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 6px 8px; border: 0; border-radius: 8px; cursor: pointer;
    background: transparent; text-align: left;
    font: 500 12px/1.2 -apple-system, sans-serif;
    color: var(--nv-text);
    transition: background 0.12s ease;
  }
  #simNativeView .plugin-flyout-item:hover { background: var(--nv-btn-hover); }
  #simNativeView .plugin-flyout-item.active {
    background: var(--nv-accent); color: var(--nv-accent-text);
  }
  #simNativeView .plugin-flyout-item:focus-visible {
    outline: 2px solid var(--nv-accent); outline-offset: -2px;
  }

  #simNativeView .plugin-prompt {

  #simNativeView .plugin-tick {

  #simNativeView .plugin-tick[data-control="radio"]    { border-radius: 50%; }
  #simNativeView .plugin-tick[data-on="true"] {
    background: var(--nv-accent); border-color: var(--nv-accent);

  /* The checkmark / dot, drawn with a pseudo-element so the row markup
     carries no glyph of its own. */
  #simNativeView .plugin-tick[data-control="checkbox"][data-on="true"]::after {
    content: ''; width: 3px; height: 7px;
    border: solid var(--nv-accent-text);

    margin-bottom: 2px;

  #simNativeView .plugin-tick[data-control="switch"]::after {
    content: ''; position: absolute; top: 1.5px; left: 1.5px;
    width: 9px; height: 9px; border-radius: 50%;

    transition: transform 0.12s ease, background 0.12s ease;

            <line x1="6.5" y1="9"  x2="14"  y2="9"/>
            <line x1="6.5" y1="13" x2="17.5" y2="13"/>

        <button class="ico-btn" id="nativeHome" title="Home" onclick="window.__nativeHome && window.__nativeHome()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"

            <path d="M3 11.2 12 4l9 7.2"/>
            <path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/>
          </svg>
        </button>
        <button class="ico-btn" id="nativeScreenshot" title="Screenshot" onclick="window.__nativeScreenshot && window.__nativeScreenshot()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round" width="17" height="17">
            <path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2L9 5h6l1.5 2h2A1.5 1.5 0 0 1 20 8.5V18a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18z"/>
            <circle cx="12" cy="13" r="3.5"/>

        <!-- Record — the moving-picture sibling of Screenshot, and the
             other half of what the size chip drives. Captures the live

             no server round-trip) in whichever mode is showing: 2D
             records the bezel composite plus the pinch dots, 3D records
             the server-rendered device frame as it already is. Hidden
             outright where MediaRecorder doesn't exist — a Record
             button that can't record is worse than none. -->
        <button class="ico-btn" id="nativeRecordBtn" title="Record video"
                aria-label="Start recording" aria-pressed="false"
                onclick="window.__nativeRecord && window.__nativeRecord()">

               The whole mark pulses while a recording is running. -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round" width="17" height="17">
            <circle cx="12" cy="12" r="8.5"/>
            <circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/>
          </svg>
          <span class="rec-timer" id="nativeRecordTimer"></span>
        </button>
        <button class="ico-btn" id="nativeAppSwitcher" title="App switcher"
                aria-label="Open app switcher"
                onclick="window.__nativeAppSwitcher && window.__nativeAppSwitcher()">
          <!-- "App-switcher" glyph mirroring the native Simulator
               toolbar's third icon — two overlapping rounded squares.
               The click fires the `app-switcher` virtual button,
               which the Swift `IndigoHIDInput` decomposes into two
               consecutive home `IndigoHIDMessageForButton` presses
               ~150 ms apart — the recipe SpringBoard listens for
               (works on Face ID iPhones with no physical home
               button). The slower swipe-and-hold gesture is still
               available on the wire as `swipe-to-app-switcher`. -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round" width="17" height="17">
            <rect x="3"  y="7"  width="13" height="13" rx="2.2"/>
            <path d="M8 7V5.2A2.2 2.2 0 0 1 10.2 3H19a2 2 0 0 1 2 2v8.8A2.2 2.2 0 0 1 18.8 16H17"/>
          </svg>
        </button>
        <!-- Shake — fires a UIKit motionShake on the frontmost app
             (shake-to-undo, shake-to-report). Momentary, like Home /
             App switcher. POSTs to `/simulators/<udid>/shake`; the
             server delegates to `simulator.shake().shake()`, backed by
             `simctl spawn notifyutil`. -->
        <button class="ico-btn" id="nativeShake" title="Shake device"
                aria-label="Shake device"
                onclick="window.__nativeShake && window.__nativeShake()">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round" width="17" height="17">
            <rect x="9" y="3" width="6" height="18" rx="1.6"/>
            <path d="M5 8.5c-1.2 2-1.2 5 0 7"/>
            <path d="M19 8.5c1.2 2 1.2 5 0 7"/>
          </svg>
        </button>
      </div>

  <div class="companion-column" id="nativeCarPlayColumn" aria-label="External display" hidden>

         exists — which is exactly what someone new to watchOS doesn't.
         Named and captioned rather than drawn in their real positions:

    <div class="watch-buttons" role="group" aria-label="Apple Watch buttons">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12">
          <path d="M6 6 18 18"/><path d="M18 6 6 18"/>
        </svg>
      </button>
    </header>
    <div id="nativeNetworkHost"></div>
  </aside>

  <!-- Simulated-location card — floating glass panel with a Leaflet map.
       The toolbar's `nativeLocationToggle` flips `[data-location="open"]`
       on the root; CSS fades the card in/out. LocationPanel
       (sim-location.js) is lazy-mounted into #nativeLocationHost on first
       open. -->
  <aside id="nativeLocationSheet" class="location-host" aria-hidden="true">
    <header class="location-host-head">
      <span class="location-host-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" width="14" height="14" aria-hidden="true">
          <path d="M12 21s7-5.5 7-11a7 7 0 0 0-14 0c0 5.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>
        </svg>
        Location
      </span>
      <button class="ico-btn location-host-close" title="Close simulated location"
              aria-label="Close simulated location"
              onclick="window.__nativeToggleLocation && window.__nativeToggleLocation()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12">
          <path d="M6 6 18 18"/><path d="M18 6 6 18"/>
        </svg>
      </button>
    </header>
    <div id="nativeLocationHost"></div>
  </aside>

  <!-- Recordings dock. A MediaRecorder artifact only exists as a Blob
       URL in this tab, so if nothing on the page links to it the
       recording is simply gone. The dock opens itself when the first
       one lands and lists them newest-first; closing it revokes every
       URL it was holding, which is what keeps a long session from
       accumulating video in memory. -->
  <aside class="rec-dock" id="nativeRecordDock" aria-label="Recordings">
    <header class="rec-dock-head">
      <span>Recordings</span>
      <!-- Two separate verbs, because they are not the same act. The ✕
           puts the card away and keeps every file; "Clear" revokes the
           Blob URLs, which destroys anything not yet downloaded with no
           undo — so it is spelled out rather than hidden behind the
           dismiss glyph people click without reading. -->
      <button class="rec-dock-clear" title="Discard these recordings and free the memory they hold"
              aria-label="Discard recordings"
              onclick="window.__nativeClearRecordings && window.__nativeClearRecordings()">Clear</button>
      <button class="ico-btn rec-dock-close" title="Hide recordings"
              aria-label="Hide recordings"
              onclick="window.__nativeHideRecordings && window.__nativeHideRecordings()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12">
          <path d="M6 6 18 18"/><path d="M18 6 6 18"/>
        </svg>
      </button>
    </header>
    <div class="rec-dock-list" id="nativeRecordList"></div>
  </aside>
</div>

<script>
  // Preview bootstrap — only when the file is opened directly. Lets
  // designers iterate on the chrome without booting a simulator.
  (function () {
    if (location.protocol !== 'file:') return;
    document.body.classList.add('preview');
    document.body.style.cssText = 'margin:0;background:#1a1a1f';
    document.getElementById('nativeDeviceName').textContent = 'iPhone 17 Pro Max';
    document.getElementById('nativeDeviceOS').textContent = 'iOS 26.4';
    var host = document.getElementById('nativeDeviceFrame');
    var img = document.createElement('img');
    img.src = '../frames/iPhone 17 Pro Max.png';
    img.style.cssText = 'display:block;height:88vh;max-height:calc(100vh - 72px);pointer-events:none';
    host.appendChild(img);
    document.querySelector('.fmt-btn[data-v="avcc"]').classList.add('active');
    document.getElementById('nativeStatus').textContent = '60 fps';
  })();
</script>
</body>
</html>
