<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Share this Mac — Baguette</title>
<style>
  /* The page around the card: the card brings its own look (families/mac/share-card.js). */
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; background: #f8fafc; }
  @media (prefers-color-scheme: dark) { body { background: #0f1115; } }
  main { width: min(420px, 100%); }
</style>
</head>
<body>
<main id="share"></main>
<script type="module">
  // Kept for compatibility: the same card the devices page shows.
  import { mountShareCard, pageBrowser } from '/families/mac/share-card.js';
  mountShareCard(document.getElementById('share'), pageBrowser(), (url) => location.replace(url));
</script>
</body>
</html>
