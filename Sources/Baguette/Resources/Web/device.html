<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>baguette device mirror</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd;
    font: 13px -apple-system, sans-serif; }
  .wrap { height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px; }
  canvas { max-width: 96vw; max-height: 88vh; background: #000;
    border-radius: 12px; }
  #status { opacity: .7; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="screen"></canvas>
  <div id="status">connecting…</div>
</div>
<script>
// Minimal device-twin mirror viewer: paints the MJPEG variant of
// /devices/:udid/stream (one JPEG per binary WS message) onto a
// canvas. Interim page until the sim UI grows a devices section —
// deliberately view-only: gestures are rejected by the server until
// the control pipe lands.
(async () => {
  const status = document.getElementById('status');
  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');

  let udid = new URLSearchParams(location.search).get('udid');
  if (!udid) {
    const list = await (await fetch('/devices.json')).json();
    udid = list.connected[0]?.udid;
    if (!udid) { status.textContent = 'no device connected — start the broadcast on the phone'; return; }
  }

  const ws = new WebSocket(`ws://${location.host}/devices/${udid}/stream?format=mjpeg`);
  ws.binaryType = 'blob';
  let frames = 0;
  let lastCount = 0;
  setInterval(() => {
    if (frames) status.textContent = `${udid} — ${frames - lastCount} fps`;
    lastCount = frames;
  }, 1000);
  let painting = false;
  ws.onmessage = async (event) => {
    if (typeof event.data === 'string') { console.log('[device]', event.data); return; }
    if (painting) return; // drop while busy; a mirror wants the newest frame
    painting = true;
    try {
      const bitmap = await createImageBitmap(event.data);
      if (canvas.width !== bitmap.width) {
        canvas.width = bitmap.width;
        canvas.height = bitmap.height;
      }
      ctx.drawImage(bitmap, 0, 0);
      bitmap.close();
      frames += 1;
    } catch { /* partial frame; skip */ }
    painting = false;
  };
  ws.onclose = () => { status.textContent = 'stream closed — is the broadcast still running?'; };
  ws.onerror = () => { status.textContent = 'stream error'; };
})();
</script>
</body>
</html>
